<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Montée en véhicule a déménagé</title>
<style>body{font-family:system-ui,sans-serif;background:#0b0d11;color:#f2f4f8;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center;padding:16px}a{color:#ff4a50}</style>
</head>
<body>
<p>Montée en véhicule a déménagé :<br><a id="lien" href="https://galianachristian-cpu.github.io/monter-vehicule/">galianachristian-cpu.github.io/monter-vehicule</a></p>
<script>
// l'ancienne version installée est désactivée, puis on part vers la nouvelle adresse
// (le lien d'un engin ou d'activation, après le #, est conservé)
var cible = 'https://galianachristian-cpu.github.io/monter-vehicule/' + location.hash;
document.getElementById('lien').href = cible;
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { if (r.scope.endsWith('/mon-app-sport/pompiers/')) r.unregister(); }); });
location.replace(cible);
</script>
</body>
</html>
