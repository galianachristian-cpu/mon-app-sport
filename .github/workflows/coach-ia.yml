# Déploie le relais du coach IA sur Cloudflare Workers quand le dossier coach-ia change
name: Déployer le coach IA

on:
  push:
    branches: [main]
    paths: ['coach-ia/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: coach-ia
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: coach-ia
          secrets: |
            ANTHROPIC_API_KEY
            COACH_CODE
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COACH_CODE: ${{ secrets.COACH_CODE }}
