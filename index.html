<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0f19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mon Programme</title>
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Mon Programme">
<!-- Firebase SDK (sauvegarde en ligne) -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#0b0f19;--bg2:#0f1524;--card:#141b2d;--card2:#1a2338;--line:#24304a;--text:#eef2f8;--muted:#8b9ab4;
  --soft:#c9d4e6;--a1:#22d3ee;--a2:#a78bfa;--ok:#34d399;--warn:#fbbf24;--ko:#f87171;
  --grad:linear-gradient(135deg,var(--a1),var(--a2));
  --r:18px;--shadow:0 10px 30px rgba(0,0,0,.35);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:radial-gradient(1200px 600px at 80% -10%,rgba(167,139,250,.12),transparent 60%),radial-gradient(900px 500px at -10% 10%,rgba(34,211,238,.10),transparent 60%),var(--bg);color:var(--text);min-height:100vh;padding-bottom:calc(150px + var(--safe-b))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* En-tête */
.top{position:sticky;top:0;z-index:50;background:var(--topbg,rgba(11,15,25,.82));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(36,48,74,.6)}
.top .wrap{display:flex;align-items:center;gap:12px;height:62px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;font-size:20px;box-shadow:0 6px 18px rgba(34,211,238,.25)}
.top h1{font-size:18px;font-weight:800;letter-spacing:-.3px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{display:block;overflow:hidden;text-overflow:ellipsis;font-size:11.5px;font-weight:500;color:var(--muted);letter-spacing:0}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.saving{background:var(--warn);animation:pulse .8s infinite}
.dot.saved{background:var(--ok);box-shadow:0 0 10px rgba(52,211,153,.6)}
.dot.error{background:var(--ko)}
.dot.local{background:var(--a2)}
@keyframes pulse{50%{transform:scale(1.4);opacity:.6}}

/* Jours */
.days{display:flex;gap:8px;overflow-x:auto;padding:16px 0 6px;scrollbar-width:none;scroll-snap-type:x mandatory}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;min-width:74px;scroll-snap-align:start;padding:10px 8px 9px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);text-align:center;transition:.2s;position:relative}
.day b{display:block;font-size:14px}
.day span{display:block;font-size:10.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px}
.day.on{background:var(--grad);border-color:transparent;color:#0b0f19;box-shadow:0 8px 20px rgba(34,211,238,.25)}
.day.on span{color:rgba(11,15,25,.75)}
.day.today::after{content:'';position:absolute;top:6px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.day.full::before{content:'✓';position:absolute;top:3px;left:7px;font-size:11px;font-weight:900;color:var(--ok)}
.day.on.full::before{color:#064e3b}

/* Carte du jour */
.hero{margin-top:10px;padding:18px;border-radius:22px;background:linear-gradient(145deg,#18223a,#121a2c);border:1px solid var(--line);display:flex;gap:16px;align-items:center;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:var(--grad);opacity:.12;filter:blur(10px)}
.hero h2{font-size:22px;letter-spacing:-.4px}
.hero p{color:var(--muted);font-size:13.5px;margin-top:3px}
.hero .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--soft)}
.ring{flex:0 0 auto;position:relative;width:86px;height:86px}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:800;font-size:20px;line-height:1}
.ring .v small{display:block;font-size:10.5px;color:var(--muted);font-weight:600;margin-top:2px}

/* Exercices */
.list{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;transition:.25s;position:relative}
.ex.done{border-color:rgba(52,211,153,.45);background:linear-gradient(180deg,rgba(52,211,153,.08),var(--card) 60%)}
.ex .row1{display:flex;align-items:center;gap:12px}
.emo{width:48px;height:48px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);display:grid;place-items:center;font-size:24px;flex:0 0 auto}
.ex .name{flex:1;min-width:0;text-align:left}
.ex .name b{display:block;font-size:16px;line-height:1.25}
.ex .name .sub{display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:wrap}
.mus{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.sr{font-size:12.5px;color:var(--muted);font-weight:600}
.check{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:20px;font-weight:900;color:transparent;flex:0 0 auto;transition:.2s}
.check:hover{border-color:var(--ok)}
.ex.done .check{background:var(--ok);border-color:var(--ok);color:#06281c;transform:scale(1.04)}
.sets{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap;align-items:center}
.set{min-width:38px;height:34px;padding:0 8px;border-radius:11px;background:var(--bg2);border:1.5px solid var(--line);font-size:12.5px;font-weight:700;color:var(--muted);transition:.15s}
.set.on{background:var(--grad);border-color:transparent;color:#0b0f19}
.set:active{transform:scale(.94)}
.sets .lbl{font-size:12px;color:var(--muted);margin-right:2px}
.logrow{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center}
.step{display:flex;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.step button{width:36px;height:38px;font-size:18px;color:var(--muted);font-weight:700}
.step button:hover{color:var(--a1);background:rgba(34,211,238,.06)}
.step input{width:58px;height:38px;border:none;background:transparent;text-align:center;font-weight:800;font-size:15px;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.step .u{font-size:11px;color:var(--muted);padding-right:8px;margin-left:-6px}
.last{font-size:12px;color:var(--muted);flex:1;min-width:140px}
.last b{color:var(--soft)}
.pr{font-size:11px;font-weight:800;color:var(--warn);background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35);padding:2px 8px;border-radius:99px}

.add{width:100%;margin-top:14px;padding:15px;border-radius:var(--r);border:1.5px dashed var(--line);color:var(--muted);font-weight:700;font-size:15px;transition:.2s}
.add:hover{border-color:var(--a1);color:var(--a1)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .e{font-size:44px;margin-bottom:8px}

/* Boutons */
a.btn{text-decoration:none;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border-radius:13px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:14px;transition:.15s}
.btn:hover{border-color:#36466a}
.btn.pri{background:var(--grad);border-color:transparent;color:#0b0f19}
.btn.danger{color:var(--ko);border-color:rgba(248,113,113,.35)}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

/* Titres de section */
h3.sec{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:26px 2px 10px;font-weight:800}

/* Programme */
.wk{display:flex;flex-direction:column;gap:10px}
.wkday{display:flex;align-items:center;gap:14px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);text-align:left;width:100%}
.wkday .n{width:46px;height:46px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:13px;flex:0 0 auto}
.wkday.today .n{background:var(--grad);color:#0b0f19;border-color:transparent}
.wkday .t{flex:1;min-width:0}
.wkday .t b{display:block;font-size:15.5px}
.wkday .t small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;border-radius:9px;background:var(--bg2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--grad);border-radius:9px;transition:width .4s}

/* Progrès */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat .v{font-size:26px;font-weight:900;letter-spacing:-.5px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .l{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:250px;margin:0 auto}
@media(max-width:430px){#saveText{display:none}.pill{padding:9px}}
.heat .h{aspect-ratio:1;border-radius:6px;background:var(--bg2);border:1px solid var(--line)}
.heat .h.l1{background:color-mix(in srgb,var(--a1) 35%,transparent);border-color:transparent}
.heat .h.l2{background:color-mix(in srgb,var(--a1) 65%,transparent);border-color:transparent}
.heat .h.l3{background:var(--a1);border-color:transparent}
.heat .h.now{outline:2px solid var(--warn);outline-offset:1px}
.heat .hd{font-size:10.5px;color:var(--muted);text-align:center;font-weight:700}
select.sel{width:100%;padding:11px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-weight:600}
.chart{margin-top:12px}
.chart svg{width:100%;height:auto;display:block}
.tbl{width:100%;border-collapse:collapse;margin-top:10px;font-size:13.5px}
.tbl td,.tbl th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px}
.rec{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:none}
.rec .t{flex:1;min-width:0}
.rec .t b{display:block;font-size:14.5px}
.rec .t small{color:var(--muted);font-size:12px}
.rec .v{font-weight:900;font-size:17px;color:var(--warn)}

/* Chrono */
.timer{display:flex;flex-direction:column;align-items:center;padding:20px 0 6px}
.bigring{position:relative;width:250px;height:250px}
.bigring svg{transform:rotate(-90deg)}
.bigring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.bigring .v b{font-size:58px;font-weight:900;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.bigring .v small{display:block;color:var(--muted);font-weight:600;font-size:13px;margin-top:-4px}
.bigring.warn b{color:var(--warn)}.bigring.end b{color:var(--ko);animation:blink .5s 4}
@keyframes blink{50%{opacity:.25}}
.presets{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.presets button{padding:9px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13.5px;color:var(--muted)}
.presets button.on{background:var(--grad);color:#0b0f19;border-color:transparent}
.ctrl{display:flex;gap:12px;margin-top:20px;align-items:center}
.ctrl .main{width:74px;height:74px;border-radius:50%;background:var(--grad);color:#0b0f19;font-size:28px;box-shadow:0 10px 26px rgba(34,211,238,.3)}
.ctrl .sm{width:52px;height:52px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:14px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:none}
.toggle span{font-weight:600;font-size:14.5px}
.toggle small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.sw{width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:.2s;flex:0 0 auto}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ok)}.sw.on::after{left:23px}

/* Mini-chrono flottant */
.mini{position:fixed;left:50%;transform:translateX(-50%) translateY(140%);bottom:calc(76px + var(--safe-b));z-index:60;width:min(520px,calc(100% - 24px));background:var(--minibg,rgba(26,35,56,.96));backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);transition:transform .3s}
.mini.show{transform:translateX(-50%) translateY(0)}
.mini .tm{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;min-width:74px}
.mini .tm.warn{color:var(--warn)}
.mini .info{flex:1;min-width:0;font-size:12.5px;color:var(--muted)}
.mini .info .bar{margin-top:6px}
.mini button{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:15px}

/* Navigation */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:70;background:var(--navbg,rgba(11,15,25,.9));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:66px}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted);position:relative}
.nav button .i{font-size:21px;transition:.2s}
.nav button.on{color:var(--text)}
.nav button.on .i{transform:translateY(-2px) scale(1.08)}
.nav button.on::before{content:'';position:absolute;top:0;width:34px;height:3px;border-radius:0 0 4px 4px;background:var(--grad)}

/* Feuilles (bottom sheets) */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;opacity:0;pointer-events:none;transition:opacity .25s}
.ov.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(640px,100%);max-height:92vh;overflow-y:auto;z-index:110;background:var(--card);border:1px solid var(--line);border-bottom:none;border-radius:24px 24px 0 0;padding:10px 18px calc(22px + var(--safe-b));transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s;visibility:hidden}
.sheet.show{transform:translate(-50%,0);visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h2{font-size:20px;letter-spacing:-.3px;margin-bottom:12px;padding-right:40px}
.sheet .x{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;background:var(--bg2);border:1px solid var(--line);font-size:16px;color:var(--muted)}
.gif{width:100%;border-radius:16px;background:#fff;min-height:120px;display:grid;place-items:center;overflow:hidden;margin-bottom:14px}
.gif img{width:100%;max-height:260px;object-fit:contain;display:block}
.gif .no{font-size:50px;padding:30px;background:var(--bg2);width:100%;text-align:center}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.three div{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.three b{display:block;font-size:18px}
.three small{color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.box h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:6px}
.box p{font-size:14.5px;line-height:1.6;white-space:pre-line}
.box.tips{border-left:3px solid var(--warn)}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fg label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.fg input,.fg select,.fg textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);font-size:15px}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--a1)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.emojis{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.emojis button{width:38px;height:38px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);font-size:19px}
.emojis button.on{border-color:var(--a1);background:rgba(34,211,238,.12)}

/* Toast */
.toast{position:fixed;left:50%;top:76px;transform:translate(-50%,-20px);z-index:200;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:11px 16px;font-weight:600;font-size:14px;box-shadow:var(--shadow);opacity:0;transition:.3s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:300}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
.profbtn{display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 4px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13px;max-width:120px}
.profbtn .pn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:28px;height:28px;border-radius:50%;background:var(--grad);color:#0b0f19;display:grid;place-items:center;font-weight:900;font-size:13px;flex:0 0 auto}
.av.big{width:58px;height:58px;font-size:24px;background:linear-gradient(135deg,var(--p1),var(--p2))}
.profs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prof{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 10px;border-radius:18px;background:var(--bg2);border:2px solid var(--line)}
.prof b{font-size:16px}.prof small{color:var(--muted);font-size:12px}
.prof.on{border-color:var(--p1);box-shadow:0 0 0 3px color-mix(in srgb,var(--p1) 25%,transparent)}
@media(max-width:430px){.top h1 small{display:none}.profbtn .pn{display:none}.profbtn{padding:4px}}
.muted{color:var(--muted)}
.inp{padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);font-size:15px}
.inp:focus{outline:none;border-color:var(--a1)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:11px}
.set{min-width:44px;height:40px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.set b{font-size:12.5px}.set small{font-size:10px;font-weight:700;opacity:.85}
.advice{margin-top:12px;padding:10px 12px;border-radius:13px;background:rgba(255,255,255,.04);border:1px dashed var(--line);font-size:13px;color:var(--soft);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.advice.up{background:color-mix(in srgb,var(--ok) 12%,transparent);border:1px solid color-mix(in srgb,var(--ok) 45%,transparent);color:var(--text)}
.chip.live{border-color:color-mix(in srgb,var(--ok) 50%,transparent);color:var(--ok)}
.duo{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;padding:10px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:13.5px;color:var(--soft);text-align:left}
.av.sm{width:26px;height:26px;font-size:12px;background:linear-gradient(135deg,var(--p1),var(--p2))}
.duo-card .duo-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-bottom:10px}
.duo-card .duo-head>div{display:flex;flex-direction:column;align-items:center;gap:5px;position:relative}
.duo-card .duo-head .av.big{width:48px;height:48px;font-size:20px}
.duo-card .lead .av{box-shadow:0 0 0 3px #fbbf24}
.crown{position:absolute;top:-14px;font-size:20px}
.vs{font-size:22px;font-weight:900}
.duo-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 0;border-top:1px solid var(--line);text-align:center}
.duo-row span{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:0 8px}
.duo-row b{font-size:16px}.duo-row b.win{color:var(--warn)}
.seg{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{flex:1;padding:9px 6px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--grad);color:#0b0f19}
.awrow{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.awrow:last-child{border-bottom:0}
.awday{display:flex;flex-direction:column;align-items:flex-start;font-weight:800;font-size:13px;text-align:left}
.awday small{font-weight:600;font-size:11px;color:var(--muted)}
.awday.all{color:#fb923c}
.awm{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.awm button{padding:8px 2px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--soft);line-height:1.15}
.awm button.on{background:color-mix(in srgb,#fb923c 22%,transparent);border-color:#fb923c;color:var(--text)}
.awm button small{display:block;font-size:10px;font-weight:600;color:var(--muted)}
.bilan .big{font-size:48px;text-align:center;margin-top:-4px}
.feels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.feels button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 2px;border-radius:14px;background:var(--bg2);border:1.5px solid var(--line)}
.feels button span{font-size:26px}.feels button small{font-size:10.5px;color:var(--muted);font-weight:700}
.feels button.on{border-color:var(--a1);background:color-mix(in srgb,var(--a1) 14%,transparent)}
.chips2{display:flex;gap:6px;overflow-x:auto;padding:12px 0 6px;scrollbar-width:none}
.chips2::-webkit-scrollbar{display:none}
.chips2 button{flex:0 0 auto;padding:7px 12px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--muted)}
.chips2 button.on{background:color-mix(in srgb,var(--c) 22%,transparent);border-color:var(--c);color:var(--text)}
.libit{display:flex;align-items:center;gap:12px;width:100%;padding:10px 4px;border-bottom:1px solid var(--line);text-align:left}
.libit .emo{width:42px;height:42px;font-size:20px}
.libit .t{flex:1;min-width:0}.libit .t b{display:block;font-size:15px}
.libit .t small{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12px;margin-top:3px;flex-wrap:wrap}
.libit .plus{width:34px;height:34px;border-radius:50%;background:var(--grad);color:#0b0f19;display:grid;place-items:center;font-weight:900}
.photos{margin-top:10px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pgrid button{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:3/4;background:var(--bg2)}
.pgrid img{width:100%;height:100%;object-fit:cover;display:block}
.pgrid span{position:absolute;left:0;right:0;bottom:0;padding:4px;font-size:11px;font-weight:700;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp figure{margin:0}.cmp img{width:100%;border-radius:12px;aspect-ratio:3/4;object-fit:cover;display:block}
.cmp figcaption{text-align:center;font-size:12px;color:var(--muted);margin-top:4px;font-weight:700}
.nav button{font-size:10.5px}
.nav button .i{font-size:20px}
.seg.small button{padding:7px 4px;font-size:12.5px}
.mb{margin:6px 0}.mbh{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}.mbh span{color:var(--muted);font-weight:700}
.meal .mlbl{font-size:11.5px;font-weight:700;color:var(--muted)}
.ingr{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.ig{padding:6px 10px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);font-size:12.5px;color:var(--soft)}
.ig b{color:var(--text)}
.ig small.cuit{color:var(--muted);font-size:11px}
.ig:hover{border-color:var(--a1)}
.tips-list p{font-size:13.5px;line-height:1.5;padding:8px 0;border-bottom:1px solid var(--line)}
.tips-list p:last-child{border-bottom:none}
.objs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.obj{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;border-radius:16px;background:var(--card);border:2px solid var(--line);cursor:pointer;text-align:center}
.obj input{position:absolute;opacity:0;pointer-events:none}
.obj span{font-size:26px}.obj b{font-size:13.5px}
.obj.on{border-color:var(--a1);background:color-mix(in srgb,var(--a1) 10%,var(--card))}
.exg{margin-bottom:8px}.exg small{font-size:11.5px;font-weight:700;color:var(--muted)}
.chips2.wrap{flex-wrap:wrap;overflow:visible;padding:6px 0 0}
.chips2 button.no{background:rgba(248,113,113,.14);border-color:rgba(248,113,113,.6);color:#fecaca}
.shop{padding:6px 14px}
.shopit{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.shopit:last-of-type{border-bottom:none}
.shopit input{width:20px;height:20px;accent-color:var(--ok);flex:0 0 auto}
.shopit span{flex:1;font-size:14.5px}.shopit b{font-size:13.5px;color:var(--soft)}
.shopit.got span,.shopit.got b{text-decoration:line-through;opacity:.5}
.wkday small{display:block;color:var(--muted);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.chip{cursor:pointer}
.coach{border-color:color-mix(in srgb,var(--a2) 45%,var(--line));background:linear-gradient(160deg,color-mix(in srgb,var(--a2) 10%,var(--card)),var(--card))}
.cycle{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 10px}
.cycle div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:12px;background:var(--bg2);border:1.5px solid var(--line);opacity:.6}
.cycle div span{font-size:20px}.cycle div small{font-size:11px;font-weight:800;color:var(--muted)}
.cycle div.past{opacity:.85}.cycle div.on{opacity:1;border-color:var(--a1);background:color-mix(in srgb,var(--a1) 14%,var(--bg2))}
.dpick{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dpick button{padding:10px 0;border-radius:11px;background:var(--bg2);border:1.5px solid var(--line);font-weight:800;font-size:13px;color:var(--muted)}
.dpick button.on{background:var(--grad);color:#0b0f19;border-color:transparent}
.fg .obj{text-transform:none;letter-spacing:0;color:var(--text);font-size:inherit}
.fg .obj b{font-size:13.5px}
.ph{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--soft)}
.ph-plyo{color:#f0abfc;border-color:rgba(232,121,249,.45)}.ph-warm,.ph-mob{color:#7dd3fc;border-color:rgba(56,189,248,.45)}.ph-cool{color:#c4b5fd;border-color:rgba(167,139,250,.45)}

/* séance guidée */
.guide{position:fixed;inset:0;z-index:150;background:radial-gradient(800px 500px at 50% -10%,color-mix(in srgb,var(--a2) 22%,transparent),transparent 60%),var(--bg);display:none;flex-direction:column;padding:12px 18px calc(18px + var(--safe-b));overflow-y:auto}
.guide.show{display:flex}
.g-top{display:flex;align-items:center;gap:10px}
.g-top button{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:18px}
.g-top div{text-align:center}.g-top b{display:block;font-size:15px}.g-top small{color:var(--muted);font-size:11.5px}
.g-ex{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:10px}
.g-emo{font-size:58px;line-height:1}.g-ex h2{font-size:26px;letter-spacing:-.5px;margin-top:8px}
.g-sub{margin-top:6px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.g-sets{display:flex;gap:7px;margin-top:16px;flex-wrap:wrap;justify-content:center}
.g-sets span{min-width:46px;padding:7px 8px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-weight:800;font-size:13px;color:var(--muted)}
.g-sets span.on{background:var(--grad);color:#0b0f19;border-color:transparent}.g-sets span.cur{border-color:var(--a1);color:var(--text)}
.g-lbl{color:var(--muted);font-weight:700;margin-top:8px}
.g-inputs{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;justify-content:center}
.g-step{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px}
.g-step button{width:54px;height:64px;border-radius:14px;font-size:28px;font-weight:800;color:var(--muted)}
.g-step div{min-width:86px}.g-step b{display:block;font-size:40px;font-weight:900;letter-spacing:-1px;font-variant-numeric:tabular-nums}.g-step small{color:var(--muted);font-weight:700;font-size:12px}
.g-plates{margin-top:12px;font-size:13.5px;color:var(--soft)}.g-tip{margin-top:10px;font-size:13px;color:var(--muted);max-width:460px}
.g-main{width:100%;max-width:520px;margin:18px auto 0;padding:22px;border-radius:22px;background:var(--grad);color:#0b0f19;font-size:22px;font-weight:900;box-shadow:0 12px 30px color-mix(in srgb,var(--a1) 35%,transparent)}
.g-rest{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.g-rest small{font-size:16px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:1px}
.g-rest b{font-size:96px;font-weight:900;letter-spacing:-3px;font-variant-numeric:tabular-nums}
.g-rest .bar{width:min(420px,90%);height:10px}
/* forme, divers */
.pick{display:flex;gap:6px;flex-wrap:wrap}
.pick button{padding:9px 12px;border-radius:12px;background:var(--bg2);border:1.5px solid var(--line);font-weight:700;font-size:13.5px;color:var(--muted)}
.pick.big button{font-size:24px;padding:6px 10px}
.pick button.on{border-color:var(--a1);background:color-mix(in srgb,var(--a1) 16%,var(--bg2));color:var(--text)}
.pick.multi button.on{border-color:var(--ko);background:rgba(248,113,113,.14)}
.ex.skip{opacity:.55}
.tmpb{font-size:12px;font-weight:700;color:#7dd3fc;margin-bottom:8px}
.eau{margin-top:12px}.glasses{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.glasses i{width:16px;height:22px;border-radius:3px 3px 6px 6px;border:1.5px solid #38bdf8;opacity:.5}.glasses i.on{background:#38bdf8;opacity:1}
.week7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week7 small{color:var(--muted);font-weight:800;font-size:11px}.week7 .col{height:70px;background:var(--bg2);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden;margin:4px 0}
.week7 .col i{display:block;width:100%;background:linear-gradient(#a78bfa,#6d28d9)}.week7 b{font-size:12px;display:block}.week7 span{font-size:11px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.badges{grid-template-columns:repeat(3,1fr)}}
.badge{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center;opacity:.6;display:flex;flex-direction:column;gap:4px;align-items:center}
.badge span{font-size:30px;filter:grayscale(1)}.badge b{font-size:13.5px}.badge small{font-size:11.5px;color:var(--muted)}.badge .bar{width:100%;margin-top:4px}
.badge.ok{opacity:1;border-color:rgba(251,191,36,.5);background:linear-gradient(160deg,rgba(251,191,36,.10),var(--card))}.badge.ok span{filter:none}.badge .okt{color:var(--warn);font-weight:800}
.defi{border-color:rgba(251,191,36,.4)}
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;color:#000;font:12px/1.4 system-ui,sans-serif;padding:0}
  #printArea h1{font-size:20px}#printArea h2{font-size:14px;margin:14px 0 6px;border-bottom:1px solid #999}
  #printArea table{width:100%;border-collapse:collapse}#printArea td,#printArea th{border:1px solid #bbb;padding:4px 6px;text-align:left}
  body{background:#fff!important;padding:0!important}
}

/* Thème clair */
:root[data-theme="light"]{--bg:#f3f5fa;--bg2:#e9edf5;--card:#ffffff;--card2:#f4f6fb;--line:#d8deea;--text:#141b2d;--muted:#5b6880;--soft:#2f3b55;--shadow:0 8px 24px rgba(20,27,45,.10);--topbg:rgba(255,255,255,.86);--navbg:rgba(255,255,255,.94);--minibg:rgba(255,255,255,.97);--ok:#059669;--warn:#d97706;--ko:#dc2626}
:root[data-theme="light"] body{background:radial-gradient(1200px 600px at 80% -10%,rgba(167,139,250,.16),transparent 60%),radial-gradient(900px 500px at -10% 10%,rgba(34,211,238,.14),transparent 60%),var(--bg)}
:root[data-theme="light"] .ov{background:rgba(20,27,45,.35)}
:root[data-theme="light"] .hero{background:linear-gradient(145deg,#ffffff,#eef2f9)}
:root[data-theme="light"] .ex.done{background:color-mix(in srgb,var(--ok) 8%,var(--card))}
:root[data-theme="light"] .stat .v{filter:saturate(1.4) brightness(.8)}

/* Bilan de la semaine */
.repban{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:12px 14px;border-radius:16px;text-align:left;background:linear-gradient(135deg,color-mix(in srgb,var(--a1) 18%,var(--card)),color-mix(in srgb,var(--a2) 18%,var(--card)));border:1px solid color-mix(in srgb,var(--a1) 40%,var(--line))}
.repban>span:first-child{font-size:26px}.repban>span:nth-child(2){flex:1}.repban b{display:block;font-size:14.5px}.repban small{color:var(--muted);font-size:12px}.repban>span:last-child{font-size:22px;color:var(--muted)}
.repscore{display:flex;align-items:center;gap:16px;margin:8px 0 14px}.repscore p{font-weight:700;font-size:15px}
.repscore .ring{position:relative;width:96px;height:96px;flex:0 0 auto}.repscore .ring .v{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:26px;font-weight:900}.repscore .ring small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.sheet .stats{grid-template-columns:repeat(2,1fr)}
.tips{display:flex;flex-direction:column;gap:8px}.tip{display:flex;gap:10px;align-items:flex-start;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}.tip span{font-size:20px}.tip p{font-size:13.5px;line-height:1.45}

/* Minuteurs */
.itmodes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
.itmodes button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);text-align:left}
.itmodes button span{font-size:22px}.itmodes button b{font-size:15px}.itmodes button small{font-size:11.5px;color:var(--muted)}
.itmodes button.on{border-color:var(--a1);background:color-mix(in srgb,var(--a1) 12%,var(--card))}
.three2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
textarea.inp{width:100%;resize:vertical;font:inherit;line-height:1.4}
.itv,.duov{display:flex;flex-direction:column;flex:1;min-height:100%}
.duov .g-ex{justify-content:center}
.itmain{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.itmain small{font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-size:13px}
.itmain h2{font-size:30px;letter-spacing:-.5px;max-width:92%}
.itmain>b{font-size:min(30vw,150px);font-weight:900;letter-spacing:-4px;font-variant-numeric:tabular-nums;line-height:1}
.itmain .bar{width:min(420px,86%);height:10px}.itmain p{color:var(--soft);font-size:15px;margin-top:8px}
.itv.work .itmain>b,.itv.work .itmain h2{color:var(--ok)}.itv.work .bar i{background:var(--ok)}
.itv.rest .itmain>b{color:var(--a1)}.itv.prep .itmain>b{color:var(--warn)}
.full.show:has(.itv.work){background:radial-gradient(900px 600px at 50% 30%,color-mix(in srgb,var(--ok) 22%,transparent),transparent 70%),var(--bg)}
.itctl{justify-content:center;gap:10px}.itctl .btn{padding:16px 20px;font-size:17px}.itctl .pri{flex:0 1 220px}

/* Course */
.runlive{margin-top:12px;padding:16px;border-radius:20px;background:var(--card);border:1.5px solid color-mix(in srgb,var(--a1) 45%,var(--line))}
.runlive.paused{border-color:var(--warn)}
.runlive>small{display:block;text-align:center;color:var(--muted);font-size:12px;font-weight:700}
.rkm{text-align:center;margin:6px 0 12px}.rkm b{font-size:72px;font-weight:900;letter-spacing:-3px;font-variant-numeric:tabular-nums;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}.rkm span{font-size:18px;font-weight:800;color:var(--muted);margin-left:4px}
.runlive .three{margin-bottom:0}
.runs{display:flex;flex-direction:column;gap:8px}
.runit{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:left;width:100%}
.runit>span:nth-child(2){flex:1}.runit b{display:block;font-size:14.5px}.runit small{color:var(--muted);font-size:12px}.runit>span:last-child{color:var(--muted);font-size:20px}
.runit svg.mini{width:56px;height:56px;border-radius:12px;background:var(--bg2);flex:0 0 auto}.rico{width:56px;height:56px;border-radius:12px;background:var(--bg2);display:grid;place-items:center;font-size:26px}
svg.trace{width:100%;height:auto;border-radius:14px;background:var(--bg2)}

/* Séance duo */
.ducols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.ducol{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--p1)}
.duhd{display:flex;align-items:center;gap:8px}.duhd .av{width:30px;height:30px;font-size:14px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--p1),var(--p2));color:#0b0f19;font-weight:900}
.ducol .g-sets{margin-top:0;gap:4px}.ducol .g-sets span{min-width:0;padding:5px 6px;font-size:11.5px}
.dustep{display:flex;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:14px}
.dustep button{width:42px;height:48px;font-size:22px;font-weight:800;color:var(--muted)}.dustep span{flex:1;text-align:center}.dustep b{display:block;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}.dustep small{font-size:11px;color:var(--muted);font-weight:700}
.durest{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:12px;padding:10px;border-radius:14px;background:var(--card);border:1px solid var(--line);opacity:.6}.durest.on{opacity:1;border-color:var(--a1)}.durest b{font-size:24px;font-variant-numeric:tabular-nums}

/* Batch cooking */
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);font-size:13.5px;line-height:1.45;cursor:pointer}
.step input{margin-top:3px;width:18px;height:18px;accent-color:var(--a1);flex:0 0 auto}.step .t{font-weight:900;color:var(--a1);min-width:34px;font-variant-numeric:tabular-nums}
.step.ok{opacity:.55}.step.ok span:last-child{text-decoration:line-through}

/* Pictogrammes animés */
.pk{display:block;width:100%;height:100%}
.pk polyline,.pk path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.pk .pk-o{stroke:#6b7486}.pk .pk-b{stroke:#dde1e7}.pk .pk-bf{stroke:#b4bcc8}.pk .pk-r{stroke:#e5484d}.pk .pk-rf{stroke:#b93a3e}
.pk .pk-hd{fill:#dde1e7;stroke:#6b7486;stroke-width:1.2}.pk .pk-sh{fill:rgba(20,30,50,.16)}
.pk .pk-p{stroke:#4f586a;stroke-width:3;stroke-linecap:round}.pk .pk-pf{fill:#59627a}.pk .pk-pl{fill:#2c3240;stroke:#59627a;stroke-width:1.6}.pk .pk-c{stroke:#7f889a;stroke-width:1.3;stroke-dasharray:2 2;fill:none}
.emo.pkb,.pkbig,.g-emo.pkg{background:radial-gradient(circle at 50% 35%,#ffffff,#dfe4ec)!important;border-color:#c9d0db}
.emo.pkb{padding:3px;overflow:hidden}
.pkbig{width:180px;height:180px;margin:0 auto 12px;background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:8px}
.g-emo.pkg{width:min(52vw,220px);height:min(52vw,220px);background:var(--card);border:1px solid var(--line);border-radius:26px;padding:10px}
.duov .g-emo.pkg{width:min(34vw,150px);height:min(34vw,150px)}

.exgif{display:block;width:100%;height:100%;object-fit:contain;border-radius:inherit;background:#fff}
.emo.pkb .exgif{border-radius:10px}
.pkbig.big{width:100%;max-width:360px;height:auto;aspect-ratio:1;padding:0;overflow:hidden;background:#fff}
.g-emo.pkg:has(.exgif){padding:0;overflow:hidden;background:#fff;width:min(70vw,300px);height:min(70vw,300px)}
.duov .g-emo.pkg:has(.exgif){width:min(40vw,170px);height:min(40vw,170px)}
.emo.pkb:has(.exgif){padding:0;background:#fff}

.itvis{width:min(62vw,260px);height:min(62vw,260px);border-radius:24px;overflow:hidden;background:#fff;margin:4px auto 6px;border:1px solid var(--line)}
.itvis.sm{width:min(36vw,140px);height:min(36vw,140px);opacity:.85}
.itv:has(.itvis) .itmain>b{font-size:min(20vw,96px)}
</style>

/* ============================================================

const keyOf = (k, i) => k + '_' + i;
const setsOf = (k, i) => sl[keyOf(k, i)] || [];
function volOf(h){
  if ((h.t || 'f') !== 'f') return 0;
  if (h.sl && h.sl.length) return h.sl.reduce((a, x) => a + (num(x.w) || 0) * (num(x.r) || 0), 0);
  return (h.w || 0) * (parseInt(h.r) || 0) * (h.s || 1);
}
// valeur « record » selon le type : kg max, reps max, secondes max, km max (ou minutes)
function scoreOf(h){
  const t = h.t || 'f';
  if (t === 'f') return h.w;
  if (t === 'c') return h.w != null ? h.w : num(h.r);

}
const unitOf = (t, h) => t === 'f' ? 'kg' : t === 'p' ? 'reps' : t === 's' ? 's' : (h && h.w != null ? 'km' : 'min');
const histOf = name => hist.filter(h => h.n === name);
const lastOf = name => { for (let i = hist.length - 1; i >= 0; i--) if (hist[i].n === name) return hist[i]; return null; };
const lastBefore = (name, d) => { for (let i = hist.length - 1; i >= 0; i--) if (hist[i].n === name && hist[i].d < d) return hist[i]; return null; };
function bestOf(name, before){ return hist.filter(h => h.n === name && (!before || h.d < before)).reduce((a, h) => { const s = scoreOf(h); return s != null && s > a ? s : a; }, 0); }

  if (t === 'c') return [h.r ? fr(h.r) + ' min' : '', h.w != null ? fr(h.w) + ' km' : ''].filter(Boolean).join(' · ') || '–';
  if (h.sl && h.sl.length){
    if (t === 'f' && !h.sl.some(x => num(x.w))) return h.sl.map(x => x.r || '–').join(', ') + ' reps';
    if (t === 'f'){ const ws = [...new Set(h.sl.map(x => num(x.w)))]; return ws.length === 1 ? `${fr(ws[0] || 0)} kg × ${h.sl.map(x => x.r || '–').join(', ')}` : h.sl.map(x => `${fr(num(x.w) || 0)}×${x.r || '–'}`).join(', '); }
    return h.sl.map(x => x.r || '–').join(', ') + (t === 's' ? ' s' : ' reps');
  }
  return t === 'f' ? `${h.w != null ? fr(h.w) + ' kg' : '–'} × ${h.r || '–'}` : `${h.r || '–'}${t === 's' ? ' s' : ' reps'}`;
}
// Double progression : toutes les séries au haut de la fourchette, 2 séances de suite, même charge → on augmente
function advice(e){
  if (typ(e) !== 'f') return null;
  if (prog && cycleIdx(prog) === 3){ const L0 = lastOf(e.n); if (L0 && L0.w) return { up: false, w: Math.round(L0.w * .9 / 2.5) * 2.5 || L0.w, txt: `Semaine de décharge : ${e.s} × ${topReps(e.r)} à ${fr(Math.round(L0.w * .9 / 2.5) * 2.5 || L0.w)} kg (≈ −10 %), sans forcer` }; return null; }
  const top = topReps(e.r), byDay = {};
  histOf(e.n).forEach(h => { byDay[h.d] = h; });
  const last2 = Object.values(byDay).sort((a, b) => a.d < b.d ? -1 : 1).slice(-2);
  const ok = h => { const s = h.sl && h.sl.length ? h.sl : null; if (!s) return h.w != null && (parseInt(h.r) || 0) >= top; return s.length >= (h.s || e.s) && s.every(x => (num(x.r) || 0) >= top && (num(x.w) || 0) >= (h.w || 0)); };

  const L = last2[last2.length - 1];
  if (!L.w) return null;
  if (last2.length === 2 && ok(last2[0]) && ok(L) && last2[0].w === L.w) return { up: true, w: +(L.w + incOf(e)).toFixed(2), from: L.w };
  if (ok(L)) return { up: false, w: L.w, txt: `Encore une séance à ${fr(L.w)} kg avec ${e.s} × ${top} et on monte 💪` };

}

    startSession(k); record(k, i);
    const list = data[k], all = list.every((x, j) => done[k][j] || isSkip(x));

    else toast('✅ ' + data[k][i].n + ' terminé');
  }

}
function logSet(k, i, j){
  const e = data[k][i], key = keyOf(k, i), lg = logs[key] || {}, t = typ(e), S = setsOf(k, i).slice();
  const val = () => ({ w: t === 'f' ? String(num(lg.w) ?? sugW(e) ?? '') : '', r: String(num(lg.r) ?? topReps(e.r)) });
  if (j < S.length){ sheetSet(k, i, j); return; }

  const tot = effS(e);

/* ============================================================
   BILAN DE FIN DE SÉANCE
   ============================================================ */
function bilanData(k){
  const s = sess[k] || {}, d = s.end ? ymd(new Date(s.end)) : ymd(new Date());
  const names = (data[k] || []).map(e => e.n);
  const H = hist.filter(h => h.d === d && names.includes(h.n));
  const vol = H.reduce((a, h) => a + volOf(h), 0);
  const recs = H.filter(h => { const b = bestOf(h.n, d), v = scoreOf(h); return b > 0 && v > b; });
  const dur = s.start && s.end ? Math.min(300, Math.round((s.end - s.start) / 60000)) : null;
  const prev = seances.filter(x => x.k === k && x.d < d).slice(-1)[0];
  return { d, k, vol, recs, dur, prev, nEx: H.length, sets: H.reduce((a, h) => a + (h.sl ? h.sl.length : h.s || 0), 0) };
}
function sheetBilan(k, fresh){

    ${diff != null ? `<div class="box"><p>${diff >= 0 ? '📈' : '📉'} <b>${diff >= 0 ? '+' : ''}${diff} %</b> de volume par rapport à la dernière fois (${fmtVol(b.prev.vol)}, ${fmtD(b.prev.d)})</p></div>` : ''}
    ${b.recs.length ? `<div class="box tips"><h4>🏆 ${b.recs.length} record${b.recs.length > 1 ? 's' : ''} battu${b.recs.length > 1 ? 's' : ''}</h4><p>${b.recs.map(h => `${esc(h.n)} : ${fr(scoreOf(h))} ${unitOf(h.t || 'f', h)}`).join('\n')}</p></div>` : ''}

/* Photos : stockées dans le navigateur (IndexedDB), jamais envoyées */
function idb(){ return new Promise((res, rej) => { if (!window.indexedDB) return rej(new Error('no idb')); const r = indexedDB.open('mp_photos', 1); r.onupgradeneeded = () => r.result.createObjectStore('p', { keyPath: 'id', autoIncrement: true }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function photoTx(mode, fn){ const db2 = await idb(); return new Promise((res, rej) => { const tx = db2.transaction('p', mode), st = tx.objectStore('p'), out = fn(st); tx.oncomplete = () => res(out && out.result); tx.onerror = () => rej(tx.error); }); }
const photoAdd = o => photoTx('readwrite', st => st.add(o));
const photoDel = id => photoTx('readwrite', st => st.delete(id));

function shrink(file, max){ return new Promise((res, rej) => { const fr2 = new FileReader(); fr2.onload = () => { const im = new Image(); im.onload = () => { const s = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .78)); }; im.onerror = rej; im.src = fr2.result; }; fr2.onerror = rej; fr2.readAsDataURL(file); }); }

const T = { total: settings.preset, left: settings.preset, run: false, end: 0, iv: null, label: 'Repos', flash: false };
function fmtT(s){ s = Math.max(0, Math.ceil(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function tick(){
  guideTick(); if (DU){ const el = $('#duT'); if (el) el.textContent = fmtT(T.left); const r = document.querySelector('.durest'); if (r) r.classList.toggle('on', T.run); }
  if (T.run){ T.left = (T.end - Date.now()) / 1000; if (T.left <= 0){ T.left = 0; T.run = false; clearInterval(T.iv); alarm(); } }
  paintTimer();
  const el = $('#elapsed'), s = sess['day' + currentDay]; if (el && s && s.start) el.textContent = elapsed(s.start);
}
setInterval(() => { const el = $('#elapsed'), s = sess['day' + currentDay]; if (el && s && s.start) el.textContent = elapsed(s.start); }, 30000);
function paintTimer(){
  const p = T.total ? T.left / T.total : 0;
  $('#miniTime').textContent = fmtT(T.left); $('#miniTime').className = 'tm' + (T.run && T.left <= 10 ? ' warn' : '');
  $('#miniBar').style.width = (p * 100) + '%'; $('#miniLbl').textContent = T.run ? T.label : (T.left <= 0 ? '⏰ Terminé !' : 'En pause');
  $('#mini').classList.toggle('show', (T.run || (T.left > 0 && T.left < T.total) || (T.left <= 0 && T.flash)) && view !== 'chrono');
  const big = $('#bigTime');
  if (big){ big.textContent = fmtT(T.left); const r = $('#rt'); if (r){ const c = +r.getAttribute('stroke-dasharray'); r.setAttribute('stroke-dashoffset', c * (1 - p)); }
    $('#bigRing').className = 'bigring' + (T.left <= 0 ? ' end' : T.run && T.left <= 10 ? ' warn' : '');
    const pb = $('#tPlay'); if (pb) pb.textContent = T.run ? '⏸' : '▶'; const lb = $('#bigLbl'); if (lb) lb.textContent = T.label; }
}
function startTimer(sec, label){
  if (sec != null){ T.total = sec; T.left = sec; }
  if (T.left <= 0) T.left = T.total;
  T.label = label || 'Repos'; T.run = true; T.flash = false; T.end = Date.now() + T.left * 1000;
  clearInterval(T.iv); T.iv = setInterval(tick, 250); paintTimer();
}
function pauseTimer(){ if (!T.run) return; T.left = (T.end - Date.now()) / 1000; T.run = false; clearInterval(T.iv); paintTimer(); }
function resetTimer(){ T.run = false; clearInterval(T.iv); T.left = T.total; T.flash = false; paintTimer(); }
function addTime(s){ if (T.run) T.end += s * 1000; else T.left = Math.max(0, T.left + s); T.total = Math.max(T.total, T.run ? (T.end - Date.now()) / 1000 : T.left); tick(); }
function alarm(){
  T.flash = true;
  if (G){ if (settings.vibe && navigator.vibrate) navigator.vibrate([200, 80, 200]); speak(G.timerSet ? '' : 'C’est reparti'); guideTimerEnd(); setTimeout(() => { T.flash = false; T.total = settings.preset; T.left = T.total; T.label = 'Repos'; paintTimer(); }, 1500); return; }
  if (settings.vibe && navigator.vibrate) navigator.vibrate([300, 120, 300, 120, 500]);
  if (settings.sound){ try{ const ctx = new (window.AudioContext || window.webkitAudioContext)(); [0, .25, .5].forEach(t => { const o = ctx.createOscillator(), g = ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value = t === .5 ? 1175 : 880; g.gain.setValueAtTime(.3, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + t + .22); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + .23); }); setTimeout(() => ctx.close(), 1200); }catch(e){} }
  toast(T.label.startsWith('Repos') ? '⏰ Repos terminé, à toi de jouer !' : '⏰ Temps écoulé !');
  setTimeout(() => { T.flash = false; T.total = settings.preset; T.left = T.total; T.label = 'Repos'; paintTimer(); }, 6000);
}

function remapKeys(k, map){

function confetti(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = $('#fx'), x = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
  const cols = [profile.a1, profile.a2, '#34d399', '#fbbf24', '#f472b6'];
  const P = Array.from({ length: 140 }, () => ({ x: innerWidth / 2, y: innerHeight * .35, vx: (Math.random() - .5) * 14, vy: Math.random() * -14 - 4, s: Math.random() * 7 + 4, c: cols[Math.random() * cols.length | 0], r: Math.random() * 6, vr: (Math.random() - .5) * .3 }));
  let t = 0; (function f(){ x.clearRect(0, 0, c.width, c.height); P.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); }); if (++t < 150) requestAnimationFrame(f); else x.clearRect(0, 0, c.width, c.height); })();
}

function hashN(s){ let h = 2166136261; for (const c of String(s)){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

// contexte d'une personne : profil courant ou l'autre profil (mode duo)
function ctxOf(pid){
  if (pid === profile.id) return { pid, nom: profile.nom, nut: nut, body, data };
  const p = PROFILES.find(x => x.id === pid);
  const d = other && other.p.id === pid ? other.d : {};

}
const nutReady = n => n && n.sexe && n.age && n.taille && (n.poids || n.poids === 0);
function weightOf(c){ const B = (c.body || []).filter(b => b.p != null).sort((a, b) => a.d < b.d ? -1 : 1); return B.length ? B[B.length - 1].p : num(c.nut && c.nut.poids) || 70; }
function sessionKcal(c, di){

function targets(c, di){
  const n = c.nut, w = weightOf(c), sx = n.sexe === 'F' ? -161 : 5;
  const bmr = Math.round(10 * w + 6.25 * n.taille - 5 * n.age + sx);
  const act = +n.act || 1.35, sk = sessionKcal(c, di), train = sk > 0;

  const man = num(n.kcalMan), auto = Math.max(floor, Math.round((tdee * f + (n.adj || 0)) / 10) * 10);
  const kcal = man ? Math.max(1000, Math.round((man + (train && n.kcalSeance !== false ? sk : 0)) / 10) * 10) : auto;
  const pk = { perte: 2.0, maintien: 1.8, muscle: 2.0, recompo: 2.0 }[n.obj || 'maintien'];
  const p = Math.round(w * pk), l = Math.round(Math.max(w * .8, kcal * .25 / 9)), g = Math.max(50, Math.round((kcal - p * 4 - l * 9) / 4));

// ajustement automatique hebdomadaire selon l'évolution du poids
function autoAdjust(){
  if (!nutReady(nut) || num(nut.kcalMan)) return null;
  const wk = curWk(); if (nut.lastAdj === wk) return null;
  const B = body.filter(b => b.p != null), now = new Date(), dd = s => (now - new Date(s + 'T12:00')) / 864e5;
  const avg = A => A.length ? A.reduce((a, b) => a + b.p, 0) / A.length : null;
  const a1 = avg(B.filter(b => dd(b.d) < 7)), a0 = avg(B.filter(b => dd(b.d) >= 7 && dd(b.d) < 14));
  nut.lastAdj = wk;
  if (a1 == null || a0 == null) { save(); return null; }
  const pct = (a1 - a0) / a0 * 100; let delta = 0, why = '';
  const o = nut.obj || 'maintien';
  if (o === 'perte'){ if (pct > -0.2){ delta = -100; why = 'perte trop lente'; } else if (pct < -1){ delta = 100; why = 'perte trop rapide (préserver le muscle)'; } }

  else { if (pct > 0.5){ delta = -100; why = 'poids en hausse'; } else if (pct < -0.5){ delta = 100; why = 'poids en baisse'; } }
  if (delta){ nut.adj = Math.max(-500, Math.min(500, (nut.adj || 0) + delta)); (nut.log = nut.log || []).push({ wk, delta, pct: +pct.toFixed(2), why }); if (nut.log.length > 30) nut.log = nut.log.slice(-30); }

}

function proteinFix(m, pTarget, kTarget){

  const prot = Object.keys(m).filter(f => PROT_G.includes(FOODS[f].grp) && FOODS[f].p / FOODS[f].k >= .08).sort((a, b) => FOODS[b].p / FOODS[b].k - FOODS[a].p / FOODS[a].k);

  if (missing > 2){ const add = Math.min(orig * 1.8, missing / (FOODS[main].p / 100)); m[main] += add; }

/* ============================================================
   CALCULATEUR DE BARRE, 1RM ET ÉCHAUFFEMENT
   ============================================================ */
const PLATES = [25, 20, 15, 10, 5, 2.5, 1.25];
function plates(w){
  const bar = +settings.bar || 20; if (!w || w <= bar) return null;
  let side = (w - bar) / 2; const out = [];
  PLATES.forEach(p => { while (side >= p - 1e-9){ out.push(p); side -= p; } });
  return { bar, out, rest: +side.toFixed(2) };
}
const platesTxt = w => { const p = plates(w); if (!p) return ''; return `Barre ${p.bar} kg + ${p.out.map(fr).join(' + ')} de chaque côté${p.rest > 0 ? ` (≈ ${fr(w - 2 * p.rest)} kg)` : ''}`; };
function oneRM(name){ return hist.filter(h => h.n === name && (h.t || 'f') === 'f').reduce((a, h) => { const S = h.sl && h.sl.length ? h.sl : [{ w: h.w, r: h.r }]; S.forEach(x => { const w = num(x.w) || 0, r = Math.min(12, num(x.r) || 0); if (w && r) a = Math.max(a, w * (1 + r / 30)); }); return a; }, 0); }
function warmup(w){ if (!w || w < 30) return []; return [[.5, 8], [.7, 5], [.85, 2]].map(([p, r]) => [Math.max(+settings.bar || 20, Math.round(w * p / 2.5) * 2.5), r]); }
function barBox(e){
  if (typ(e) !== 'f') return '';
  const w = sugW(e) || num((logs[keyOf('day' + currentDay, (data['day' + currentDay] || []).indexOf(e))] || {}).w), rm = oneRM(e.n), wu = warmup(w);
  if (!w && !rm) return '';
  return `<div class="box"><h4>🏋️ Charges</h4><p>${w ? `<b>${fr(w)} kg</b> : ${esc(platesTxt(w) || 'pas besoin de disques')}` : ''}${rm ? `\n1RM estimé : <b>${fr(Math.round(rm))} kg</b> (75 % = ${fr(Math.round(rm * .75 / 2.5) * 2.5)} kg)` : ''}${wu.length ? `\nÉchauffement : ${wu.map(([x, r]) => `${fr(x)} × ${r}`).join(' · ')}` : ''}</p></div>`;
}

function guideAction(a, b){

  if (a === 'voice'){ settings.voice = !settings.voice; safeSet('mp_settings', settings); return guideRender(); }
  if (a === 'prev' || a === 'next'){ const L = data[k]; let j = i; do { j = (j + (a === 'next' ? 1 : L.length - 1)) % L.length; } while (isSkip(L[j]) && j !== i); G.i = j; G.phase = 'work'; announceEx(); return guideRender(); }
  if (a === 'adj'){ if (!logs[key]) logs[key] = { w:'', r:'' }; const f = b.dataset.f, base = num(logs[key][f]) ?? (f === 'w' ? sugW(e) : topReps(e.r)) ?? 0; logs[key][f] = String(+Math.max(0, base + +b.dataset.d).toFixed(2)); save(); return guideRender(); }
  if (a === 'plus'){ addTime(15); return; }
  if (a === 'skip'){ resetTimer(); G.phase = 'work'; announceEx(); return guideRender(); }
  if (a === 'timer'){ G.phase = 'timer'; startTimer(num((logs[key] || {}).r) ?? topReps(e.r), e.n + ' · série ' + (setsOf(k, i).length + 1)); speak('Go'); G.phase = 'rest'; G.timerSet = true; return guideRender(); }

    if (typ(e) === 'c'){ sets[key] = 1; setDone(k, i, true); save(); }
    else logSet(k, i, setsOf(k, i).length);
    afterSet();
  }
}
function afterSet(){
  if (!G) return;

  if (!data[k].some((x, j) => !(done[k] || [])[j] && !isSkip(x))){ speak('Séance terminée, bravo !'); closeGuide(); return; }
  if (fin){ const j = nextIdx(k, i + 1); G.i = j; }

  let recs = 0; const bestBy = {}; hist.slice().sort((a, b) => a.d < b.d ? -1 : 1).forEach(h => { const s = scoreOf(h); if (s == null) return; if (bestBy[h.n] != null && s > bestBy[h.n]) recs++; bestBy[h.n] = Math.max(bestBy[h.n] || 0, s); });

async function lookupBarcode(code){
  const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,brands,nutriments,serving_quantity`);
  const j = await r.json(); if (!j || j.status !== 1 || !j.product) throw new Error('introuvable');
  const p = j.product, nn = p.nutriments || {};
  const k = nn['energy-kcal_100g'] ?? (nn['energy_100g'] ? nn['energy_100g'] / 4.184 : null);
  if (k == null) throw new Error('pas de valeurs');
  return { id: 'off_' + code, n: (p.product_name || 'Produit') + (p.brands ? ' (' + p.brands.split(',')[0] + ')' : ''), k: Math.round(k), p: +(nn.proteins_100g || 0), g: +(nn.carbohydrates_100g || 0), l: +(nn.fat_100g || 0), ray: 'epicerie', grp: 'autre', serv: p.serving_quantity ? +p.serving_quantity : null };
}

  if (!('BarcodeDetector' in window) || !navigator.mediaDevices){ box.querySelector('.scanmsg').textContent = 'Le scan par caméra n’est pas disponible sur ce téléphone : tape le numéro sous le code-barres.'; return; }
  try{

    loop();

function weightTrend(){

  if (P.length < 3 || P[P.length - 1][0] - P[0][0] < 7) return null;

  const sl = P.reduce((a, p) => a + (p[0] - mx) * (p[1] - my), 0) / P.reduce((a, p) => a + (p[0] - mx) ** 2, 0);

}

  if (st.recs) tips.push(['🏆', `${st.recs} record${st.recs > 1 ? 's' : ''} battu${st.recs > 1 ? 's' : ''} cette semaine : la progression marche, garde la même régularité.`]);
  if (som != null && som < 7) tips.push(['😴', `Sommeil moyen : ${fr(som.toFixed(1))} h. Couche-toi 30 minutes plus tôt : c’est la nuit que les muscles se reconstruisent.`]);
  if (eauAvg < g * .6) tips.push(['💧', `Seulement ${fr(eauAvg.toFixed(1))} verres d’eau par jour en moyenne (objectif ${g}). Garde une gourde à portée de main.`]);
  if (nutPct < 60 && nutReady(nut)) tips.push(['🥘', `Repas suivis à ${nutPct} %. Le batch cooking du dimanche (Nutrition → Semaine) aide beaucoup à tenir le plan.`]);
  if (tr && obj === 'perte' && tr.perWeek > -.1) tips.push(['⚖️', 'Le poids stagne. L’appli ajuste tes calories chaque lundi ; surveille aussi les grignotages et les boissons sucrées.']);
  if (tr && obj === 'perte' && tr.perWeek < -(tr.now * .01)) tips.push(['⚠️', `Tu perds vite (${fr(tr.perWeek.toFixed(1))} kg/semaine). Au-delà de 1 % par semaine, tu risques de perdre du muscle : mange un peu plus.`]);

}

function stretchList(zone, n, solo){
  let zs = zone === 'tout' ? ['bas', 'hanches', 'haut', 'dos'] : zone === 'auto' ? null : [zone];
  if (!zs){ const ms = (data['day' + todayIdx()] || []).map(e => e.m); const c = {}; ms.forEach(m => (ZONE_OF_M[m] || []).forEach((z, k) => { c[z] = (c[z] || 0) + (k ? 1 : 2); })); zs = Object.keys(c).sort((a, b) => c[b] - c[a]); if (!zs.length) zs = ['bas', 'hanches', 'haut', 'dos']; }
  const seed = hashN(today() + zone), pools = zs.map(z => Object.keys(STRETCH).filter(k => STRETCH[k][0] === z && LIB_BY[k] && (!solo || !/à deux/.test(k))));
  pools.forEach((p, i) => { const r = rng(seed + i); for (let j = p.length - 1; j > 0; j--){ const q = Math.floor(r() * (j + 1)); [p[j], p[q]] = [p[q], p[j]]; } });
  const out = []; for (let i = 0; out.length < n && i < 40; i++){ const p = pools[i % pools.length]; const x = p.shift(); if (x) out.push(x); if (pools.every(q => !q.length)) break; }
  return out;
}
function startStretch(zone){ const c = Object.assign({}, itCfg(), { mode:'etir', eZone: zone || 'auto' }); itStart(c); }
/* ============================================================
   RENDU ET ÉVÉNEMENTS
   ============================================================ */
function render(){
  document.querySelectorAll('.nav [data-go]').forEach(b => b.classList.toggle('on', b.dataset.go === view));
  $('#subTitle').textContent = profile.nom + ' · ' + { seance: DAY_NAMES[currentDay] + ' · ' + dayTitle(currentDay), semaine: 'Ma semaine', nutrition: 'Nutrition', progres: 'Mes progrès', chrono: 'Chrono' }[view];
  ({ seance: viewSeance, semaine: viewSemaine, nutrition: viewNutrition, progres: viewProgres, chrono: viewChrono })[view]();
  paintTimer();
}
function go(v){ view = v; render(); window.scrollTo({ top: 0 }); if (v === 'progres' || v === 'nutrition') loadOther(); }
document.querySelectorAll('.nav [data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
$('#ov').onclick = closeSheet;
$('#miniStop').onclick = () => { resetTimer(); $('#mini').classList.remove('show'); };
$('#miniPlus').onclick = () => addTime(15);
$('#miniTime').onclick = () => go('chrono');
$('#profBtn').onclick = sheetProfiles;
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ if (G && !$('#sheet').classList.contains('show')) closeGuide(); else closeSheet(); } });
$('#guide').addEventListener('click', e => { const b = e.target.closest('[data-g]'); if (b) guideAction(b.dataset.g, b); });

document.addEventListener('click', e => {
  const g2 = e.target.closest('[data-go2]'); if (g2){ if (g2.dataset.nd != null){ nutDay = +g2.dataset.nd; nutTab = 'jour'; } go(g2.dataset.go2); return; }
  const nt = e.target.closest('[data-ntab]'); if (nt){ nutTab = nt.dataset.ntab; viewNutrition(); return; }
  const pt = e.target.closest('[data-ptab]'); if (pt){ progTab = pt.dataset.ptab; viewProgres(); return; }
  const b = e.target.closest('[data-act],[data-day]'); if (!b || b.closest('#sheet [data-prof]')) return;
  const a = b.dataset.act, i = +b.dataset.i, k = 'day' + currentDay;
  if (!a && b.dataset.day != null){ currentDay = +b.dataset.day; render(); return; }
  switch (a){
    case 'close': closeSheet(); break;
    case 'detail': sheetDetail(i); break;
    case 'add': sheetEdit(-1); break;
    case 'lib': sheetLib(); break;
    case 'edit': sheetEdit(i); break;
    case 'del': sheetConfirm('Supprimer « ' + esc(data[k][i].n) + ' » ?', 'Supprimer', () => delEx(i)); break;
    case 'move': moveEx(i, +b.dataset.d); break;
    case 'goday': currentDay = +b.dataset.day; go('seance'); break;
    case 'title': sheetTitle(+b.dataset.day); break;
    case 'bilan': sheetBilan(k, false); break;
    case 'coach': sheetCoach(); break;
    case 'guide': startGuide(); break;
    case 'forme': sheetForme(); break;
    case 'pdf': printProgram(); break;
    case 'install': if (installEvt){ installEvt.prompt(); installEvt = null; } break;
    case 'recipe': sheetRecipe(b.dataset.rid2); break;
    case 'eau': { const d = weekDates(curWk())[nutDay], f = forme[d] = forme[d] || {}; f.eau = Math.max(0, (f.eau || 0) + +b.dataset.d); if (+b.dataset.d > 0 && f.eau === eauGoal()) toast('💧 Objectif d’eau atteint, bravo !'); save(); viewNutrition(); break; }
    case 'coach-undo': coachUndo(); break;
    case 'recette': sheetRecette(b.dataset.meal); break;
    case 'swap': sheetSwap(b.dataset.meal, b.dataset.f); break;
    case 'mchange': changeMeal(b.dataset.meal); break;
    case 'mother': sheetOther(b.dataset.meal); break;
    case 'mok': { const date = weekDates(curWk())[nutDay], J = journalOf(date); if (J[b.dataset.meal] === 'ok') delete J[b.dataset.meal]; else J[b.dataset.meal] = 'ok'; trimJournal(); save(); viewNutrition(); break; }
    case 'regen': foyer.salt = (foyer.salt || 0) + 1; delete foyer.plans[curWk()]; saveFoyer(); viewNutrition(); toast('🎲 Nouveaux menus générés'); break;
    case 'nday': nutDay = +b.dataset.day2; nutTab = 'jour'; viewNutrition(); window.scrollTo({ top: 0 }); break;
    case 'done': {
      const now = !(done[k] || [])[i], e2 = data[k][i], key = keyOf(k, i);
      if (now && typ(e2) !== 'c'){ const S = setsOf(k, i).slice(), lg = logs[key] || {}; while (S.length < effS(e2)) S.push({ w: typ(e2) === 'f' ? String(num(lg.w) ?? sugW(e2) ?? '') : '', r: String(num(lg.r) ?? topReps(e2.r)) }); sl[key] = S; }
      if (!now){ sl[key] = []; }
      sets[key] = now ? effS(e2) : 0;
      setDone(k, i, now); render(); save(); break;
    }
    case 'set': logSet(k, i, +b.dataset.j); break;
    case 'adj': {
      const key = keyOf(k, i), f = b.dataset.f; if (!logs[key]) logs[key] = { w:'', r:'' };
      const inp = b.parentElement.querySelector('input');
      const base = num(logs[key][f]) ?? num(inp && inp.placeholder) ?? 0, nv = Math.max(0, base + +b.dataset.d);
      logs[key][f] = String(+nv.toFixed(2)); if (inp) inp.value = logs[key][f];
      save(); break;
    }
    case 'apply': { const key = keyOf(k, i); if (!logs[key]) logs[key] = { w:'', r:'' }; logs[key].w = String(b.dataset.w); render(); save(); toast('📈 Nouvelle charge : ' + fr(b.dataset.w) + ' kg'); break; }
    case 'go-s': { const e2 = data[k][i], lg = logs[keyOf(k, i)] || {}, sec = num(lg.r) ?? topReps(e2.r), n = setsOf(k, i).length + 1; startTimer(sec, e2.n + ' · série ' + Math.min(n, e2.s)); break; }
    case 'resetweek': sheetConfirm('Remettre toutes les coches de la semaine à zéro ?', 'Remettre à zéro', () => { done = {}; sets = {}; sl = {}; sess = {}; render(); save(); toast('🔄 Semaine remise à zéro'); }); break;
    case 'export': downloadFile('mon-programme-' + profile.nom + '-' + ymd(new Date()) + '.json', JSON.stringify(snapshot(), null, 1), 'application/json'); break;
    case 'ics': { const h = $('#rH'); if (h && h.value){ settings.rappelH = h.value; safeSet('mp_settings', settings); } downloadFile('rappels-sport-' + profile.nom + '.ics', makeIcs(), 'text/calendar'); toast('🔔 Ouvre le fichier pour ajouter les rappels à ton agenda'); break; }
    case 'bdel': body = body.filter(x => x.d !== b.dataset.d); save(); viewProgres(); break;
    case 'preset': settings.preset = +b.dataset.s; safeSet('mp_settings', settings); if (!T.run){ T.total = settings.preset; T.left = T.total; } viewChrono(); break;
    case 'tplay': T.run ? pauseTimer() : startTimer(null, T.label || 'Repos'); break;
    case 'treset': resetTimer(); break;
    case 't+15': addTime(15); break;
    case 't-15': addTime(-15); break;
    case 'opt': settings[b.dataset.k] = !settings[b.dataset.k]; safeSet('mp_settings', settings); viewChrono(); break;
  }
});
document.addEventListener('change', e => {
  const inp = e.target.closest('[data-log]'); if (!inp) return;
  const key = keyOf('day' + currentDay, inp.dataset.i); if (!logs[key]) logs[key] = { w:'', r:'' };
  logs[key][inp.dataset.log] = inp.value; save();
});
// balayage gauche / droite pour changer de jour
let sx = null, sy = null;
$('#app').addEventListener('touchstart', e => { if (view !== 'seance' || e.target.closest('.days,input,.sets,.advice')) { sx = null; return; } sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
$('#app').addEventListener('touchend', e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5){ currentDay = (currentDay + (dx < 0 ? 1 : 6)) % 7; render(); } sx = null; }, { passive: true });
window.addEventListener('pagehide', () => { flushSave(); });

if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
(async function init(){
  applyTheme(); applyProfileTheme();
  T.total = T.left = settings.preset;
  currentDay = todayIdx();
  render();
  await load();
  render();
  const on = document.querySelector('.day.on'); if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' });
  setTimeout(remCheck, 3000);
})();
</script>
