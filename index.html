<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏋️ Mon Programme</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',system-ui,sans-serif;background:#0a0e17;color:#f0f4f8;padding:16px;max-width:850px;margin:0 auto}
        
        .header{display:flex;justify-content:space-between;align-items:center;padding:20px 0 10px;border-bottom:2px solid #2a3a4f;margin-bottom:16px;flex-wrap:wrap;gap:10px}
        .header h1{font-size:1.8rem;background:linear-gradient(135deg,#00d4ff,#b388ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .header-right{display:flex;align-items:center;gap:12px}
        
        .save-indicator{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:20px;border:1px solid #2a3a4f;background:#111827;font-size:0.75rem}
        .save-dot{width:12px;height:12px;border-radius:50%;display:inline-block;transition:all 0.5s ease}
        .save-dot.saving{background:#ffab00;box-shadow:0 0 12px rgba(255,171,0,0.4);animation:pulse 0.8s ease-in-out infinite}
        .save-dot.saved{background:#00e676;box-shadow:0 0 12px rgba(0,230,118,0.3)}
        .save-dot.error{background:#ff5252;box-shadow:0 0 12px rgba(255,82,82,0.3)}
        @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
        .save-text{color:#8ba0b8;font-weight:600}
        .save-text.saved{color:#00e676}
        .save-text.error{color:#ff5252}
        
        .btn-add{background:#00d4ff;color:#0a0e17;border:none;padding:8px 18px;border-radius:10px;font-weight:700;cursor:pointer;font-size:0.85rem;font-family:inherit;transition:background 0.3s}
        .btn-add:hover{background:#00b8d4}
        
        /* Timer */
        .timer-section{background:#111827;border:1px solid #2a3a4f;border-radius:14px;padding:16px 20px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
        .timer-section .timer-display{font-size:2.5rem;font-weight:700;font-family:'Courier New',monospace;color:#00d4ff;min-width:120px;text-align:center}
        .timer-section .timer-display.warning{color:#ffab00}
        .timer-section .timer-display.danger{color:#ff5252;animation:blink 0.5s ease-in-out 3}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
        .timer-section .timer-controls{display:flex;gap:6px;flex-wrap:wrap}
        .timer-section .timer-controls button{padding:6px 14px;border-radius:8px;border:1px solid #2a3a4f;background:transparent;color:#8ba0b8;cursor:pointer;font-size:0.7rem;font-family:inherit;transition:all 0.3s ease}
        .timer-section .timer-controls button:hover{background:#2a3a4f;color:#f0f4f8}
        .timer-section .timer-controls button.play{background:#00e676;color:#0a0e17;border-color:#00e676}
        .timer-section .timer-controls button.play:hover{background:#00c853}
        .timer-section .timer-controls button.stop{background:#ff5252;color:#fff;border-color:#ff5252}
        .timer-section .timer-controls button.stop:hover{background:#d32f2f}
        .timer-section .timer-presets{display:flex;gap:4px;flex-wrap:wrap}
        .timer-section .timer-presets button{padding:4px 10px;border-radius:6px;border:1px solid #2a3a4f;background:transparent;color:#8ba0b8;cursor:pointer;font-size:0.65rem;font-family:inherit;transition:all 0.3s ease}
        .timer-section .timer-presets button:hover{border-color:#00d4ff;color:#f0f4f8}
        .timer-section .timer-presets button.active{background:#00d4ff;color:#0a0e17;border-color:#00d4ff}
        
        .day-selector{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px}
        .day-btn{padding:10px 2px;border:2px solid #2a3a4f;border-radius:10px;background:#111827;color:#8ba0b8;cursor:pointer;font-weight:700;font-size:0.65rem;text-align:center;transition:all 0.3s ease;font-family:inherit}
        .day-btn:hover{border-color:#00d4ff;color:#f0f4f8}
        .day-btn.active{border-color:#00d4ff;background:#00d4ff;color:#0a0e17}
        .day-btn .sub{display:block;font-weight:400;font-size:0.5rem;opacity:0.7;margin-top:2px}
        .weekday-indicator{text-align:center;padding:8px 16px;background:#00d4ff;color:#0a0e17;border-radius:12px;font-weight:700;font-size:1rem;margin-bottom:16px}
        .progress{text-align:center;color:#8ba0b8;margin-bottom:16px;font-size:0.9rem}
        .progress strong{color:#00d4ff}
        
        .exercise-card{background:#111827;border:1px solid #2a3a4f;border-radius:14px;padding:14px 16px;margin-bottom:10px}
        .exercise-card .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
        .exercise-card .emoji{font-size:1.8rem;width:40px;height:40px;border-radius:10px;background:#0a0e17;border:1px solid #2a3a4f;display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .exercise-card .info{flex:1;min-width:100px}
        .exercise-card .info .name{font-weight:700;font-size:0.95rem}
        .exercise-card .info .muscle{font-size:0.55rem;font-weight:400;color:#8ba0b8;background:#0a0e17;padding:2px 10px;border-radius:20px;margin-left:6px}
        .exercise-card .info .sets-reps{display:flex;align-items:center;gap:4px;margin-top:4px;flex-wrap:wrap;font-size:0.7rem;color:#8ba0b8}
        .exercise-card .info .sets-reps .val{color:#00d4ff;font-weight:700;min-width:20px;text-align:center}
        .exercise-card .info .sets-reps .adj{width:20px;height:20px;border-radius:50%;border:1px solid #2a3a4f;background:transparent;color:#8ba0b8;cursor:pointer;font-size:0.6rem;display:flex;align-items:center;justify-content:center;font-family:inherit}
        .exercise-card .info .sets-reps .adj:hover{border-color:#00d4ff;color:#00d4ff}
        .exercise-card .log{display:flex;align-items:center;gap:6px;font-size:0.7rem;color:#8ba0b8;flex-wrap:wrap}
        .exercise-card .log input{width:40px;padding:2px 4px;border-radius:6px;border:1px solid #2a3a4f;background:#0a0e17;color:#f0f4f8;font-size:0.7rem;text-align:center}
        .exercise-card .check{width:28px;height:28px;border-radius:50%;border:2px solid #2a3a4f;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.9rem;color:transparent;transition:all 0.3s ease;flex-shrink:0}
        .exercise-card .check.done{background:#00e676;border-color:#00e676;color:#0a0e17}
        
        .exercise-card .actions{display:flex;gap:6px;border-top:1px solid #2a3a4f;padding-top:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
        .exercise-card .actions button{background:transparent;border:1px solid #2a3a4f;border-radius:6px;color:#8ba0b8;cursor:pointer;padding:4px 12px;font-size:0.7rem;font-family:inherit;transition:all 0.3s ease}
        .exercise-card .actions button:hover{background:#2a3a4f;color:#f0f4f8}
        .exercise-card .actions .edit:hover{border-color:#00d4ff;color:#00d4ff}
        .exercise-card .actions .del:hover{border-color:#f85149;color:#f85149;background:rgba(248,81,73,0.1)}
        .exercise-card .actions .move-btn{padding:4px 10px;font-size:0.7rem;border:1px solid #2a3a4f;border-radius:6px;background:transparent;color:#8ba0b8;cursor:pointer;font-family:inherit;transition:all 0.3s ease}
        .exercise-card .actions .move-btn:hover{background:#2a3a4f;color:#f0f4f8}
        .exercise-card .actions .move-btn.up:hover{border-color:#00d4ff;color:#00d4ff}
        .exercise-card .actions .move-btn.down:hover{border-color:#b388ff;color:#b388ff}
        .exercise-card .actions .move-btn:disabled{opacity:0.3;cursor:not-allowed}
        
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px}
        .modal-overlay.active{display:flex}
        .modal{background:#111827;border:1px solid #2a3a4f;border-radius:16px;max-width:550px;width:100%;max-height:90vh;overflow-y:auto;padding:24px;animation:fadeIn 0.3s ease}
        @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        .modal .close{float:right;background:none;border:none;color:#8ba0b8;font-size:1.5rem;cursor:pointer;padding:0 4px}
        .modal .close:hover{color:#f0f4f8}
        .modal h2{font-size:1.2rem;margin-bottom:12px}
        .modal .form-group{margin-bottom:14px}
        .modal .form-group label{display:block;font-size:0.7rem;font-weight:600;color:#8ba0b8;margin-bottom:3px;text-transform:uppercase;letter-spacing:0.5px}
        .modal .form-group input,.modal .form-group select,.modal .form-group textarea{width:100%;padding:8px 12px;border-radius:8px;border:1px solid #2a3a4f;background:#0a0e17;color:#f0f4f8;font-size:0.9rem;font-family:inherit}
        .modal .form-group input:focus,.modal .form-group select:focus,.modal .form-group textarea:focus{outline:none;border-color:#00d4ff}
        .modal .form-group textarea{resize:vertical;min-height:50px}
        .modal .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        .modal .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
        .btn-ghost{background:transparent;color:#8ba0b8;border:1px solid #2a3a4f;padding:8px 16px;border-radius:8px;font-weight:600;cursor:pointer;font-family:inherit}
        .btn-ghost:hover{background:#1a2332;color:#f0f4f8}
        .btn-primary{background:#00d4ff;color:#0a0e17;border:none;padding:8px 16px;border-radius:8px;font-weight:700;cursor:pointer;font-family:inherit}
        .btn-primary:hover{background:#00b8d4}
        .modal .detail-section{background:#0a0e17;padding:12px 14px;border-radius:10px;border:1px solid #2a3a4f;margin-bottom:10px}
        .modal .detail-section h4{font-size:0.6rem;text-transform:uppercase;color:#8ba0b8;margin-bottom:4px;letter-spacing:0.5px}
        .modal .detail-section p{font-size:0.85rem;line-height:1.7;white-space:pre-line}
        .modal .detail-section .tips{border-left:3px solid #ffab00;padding-left:12px}
        .modal .detail-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
        .modal .detail-stats .stat{text-align:center;background:#0a0e17;padding:8px;border-radius:10px;border:1px solid #2a3a4f}
        .modal .detail-stats .stat .value{font-size:1.3rem;font-weight:800;color:#00d4ff}
        .modal .detail-stats .stat .label{font-size:0.5rem;text-transform:uppercase;color:#8ba0b8;letter-spacing:0.5px;margin-top:2px}
        .modal .image-container{width:100%;background:#0a0e17;border:1px solid #2a3a4f;border-radius:12px;margin-bottom:12px;min-height:150px;display:flex;align-items:center;justify-content:center}
        .modal .image-container img{width:100%;max-height:200px;object-fit:contain;border-radius:12px}
        .modal .image-container .no-img{font-size:2rem;opacity:0.3}
        .modal .gif-input{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
        .modal .gif-input input{flex:1;padding:6px 10px;border-radius:8px;border:1px solid #2a3a4f;background:#0a0e17;color:#f0f4f8;font-size:0.8rem;font-family:inherit;min-width:120px}
        .modal .gif-input button{padding:6px 14px;border-radius:8px;border:none;background:#00d4ff;color:#0a0e17;font-weight:700;cursor:pointer;font-size:0.75rem;font-family:inherit}
        .modal .gif-input button:hover{background:#00b8d4}
        
        @media (max-width:600px){.day-selector{grid-template-columns:repeat(7,1fr);gap:3px}.day-btn{font-size:0.5rem;padding:6px 2px}.timer-section{flex-direction:column;align-items:stretch}.timer-section .timer-display{font-size:2rem}.timer-section .timer-presets{justify-content:center}}
        @media (max-width:480px){.day-selector{grid-template-columns:repeat(4,1fr);gap:4px}.day-btn{font-size:0.6rem;padding:8px 4px}.exercise-card{padding:12px}.exercise-card .top{gap:8px}.exercise-card .info .name{font-size:0.85rem}.modal{padding:16px}.modal .form-row{grid-template-columns:1fr}.modal .detail-stats{grid-template-columns:1fr 1fr}.exercise-card .actions{gap:4px}.exercise-card .actions button{padding:3px 8px;font-size:0.6rem}}
    </style>
</head>
<body>

    <div class="header">
        <h1>🏋️ Mon Programme</h1>
        <div class="header-right">
            <div class="save-indicator" id="saveIndicator">
                <span class="save-dot" id="saveDot"></span>
                <span class="save-text" id="saveText">Connexion...</span>
            </div>
            <button class="btn-add" onclick="openAdd()">➕ Ajouter</button>
        </div>
    </div>

    <!-- ===== CHRONOMÈTRE ===== -->
    <div class="timer-section">
        <div class="timer-display" id="timerDisplay">01:30</div>
        <div class="timer-controls">
            <button class="play" onclick="startTimer()">▶️ Démarrer</button>
            <button onclick="pauseTimer()">⏸️ Pause</button>
            <button class="stop" onclick="resetTimer()">⏹️ Réinitialiser</button>
        </div>
        <div class="timer-presets" id="timerPresets">
            <button data-seconds="30" onclick="setTimerPreset(30)">30s</button>
            <button data-seconds="60" onclick="setTimerPreset(60)">1min</button>
            <button data-seconds="90" onclick="setTimerPreset(90)" class="active">1min30</button>
            <button data-seconds="120" onclick="setTimerPreset(120)">2min</button>
            <button data-seconds="180" onclick="setTimerPreset(180)">3min</button>
        </div>
    </div>

    <div class="day-selector" id="daySelector">
        <button class="day-btn" data-day="0">Lun<br><span class="sub">Poitrine</span></button>
        <button class="day-btn" data-day="1">Mar<br><span class="sub">Dos</span></button>
        <button class="day-btn" data-day="2">Mer<br><span class="sub">Jambes</span></button>
        <button class="day-btn" data-day="3">Jeu<br><span class="sub">Épaules</span></button>
        <button class="day-btn" data-day="4">Ven<br><span class="sub">Poitrine</span></button>
        <button class="day-btn" data-day="5">Sam<br><span class="sub">Dos</span></button>
        <button class="day-btn" data-day="6">Dim<br><span class="sub">Jambes</span></button>
    </div>

    <div class="weekday-indicator" id="weekdayIndicator">📅 Lundi — Poitrine & Triceps</div>

    <div class="progress">✅ <strong id="doneCount">0</strong> / <span id="totalCount">0</span></div>

    <div id="exercisesContainer"></div>

    <!-- MODALS -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal">
            <button class="close" onclick="closeDetail()">✕</button>
            <h2 id="detailTitle">🏋️ Exercice</h2>
            <div class="image-container" id="detailImage"><div class="no-img">🏋️</div></div>
            <div class="gif-input">
                <input type="text" id="gifInput" placeholder="URL du GIF">
                <button onclick="updateGif()">Mettre à jour</button>
            </div>
            <div class="detail-stats" id="detailStats"></div>
            <div id="detailBody"></div>
        </div>
    </div>

    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <button class="close" onclick="closeEdit()">✕</button>
            <h2 id="editTitle">✏️ Modifier</h2>
            <form id="editForm" onsubmit="saveEdit(event)">
                <div class="form-group"><label>Nom</label><input type="text" id="eName" required></div>
                <div class="form-group">
                    <label>Groupe musculaire</label>
                    <select id="eMuscle">
                        <option value="Épaules">Épaules</option>
                        <option value="Biceps">Biceps</option>
                        <option value="Triceps">Triceps</option>
                        <option value="Pectoraux">Pectoraux</option>
                        <option value="Dos">Dos</option>
                        <option value="Abdos">Abdos</option>
                        <option value="Fessiers">Fessiers</option>
                        <option value="Quadriceps">Quadriceps</option>
                        <option value="Ischio-jambiers">Ischio-jambiers</option>
                        <option value="Mollets">Mollets</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Séries</label><input type="number" id="eSets" min="1"></div>
                    <div class="form-group"><label>Répétitions</label><input type="text" id="eReps"></div>
                </div>
                <div class="form-group"><label>Emoji</label><input type="text" id="eEmoji" placeholder="Ex: 🏋️ 💪 🔥" maxlength="4"></div>
                <div class="form-group"><label>Description</label><textarea id="eDesc" rows="3"></textarea></div>
                <div class="form-group"><label>Conseils</label><textarea id="eTips" rows="3"></textarea></div>
                <div class="form-group"><label>GIF (URL)</label><input type="text" id="eGif" placeholder="https://..."></div>
                <input type="hidden" id="eDayKey">
                <input type="hidden" id="eIndex">
                <div class="modal-actions">
                    <button type="button" class="btn-ghost" onclick="closeEdit()">Annuler</button>
                    <button type="submit" class="btn-primary">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ============================================================
        // CONFIGURATION FIREBASE
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAcqFFFbRlKgnL7LQLY6YFoGV8oYSqBSWA",
            authDomain: "mon-app-sport-2cba3.firebaseapp.com",
            projectId: "mon-app-sport-2cba3",
            storageBucket: "mon-app-sport-2cba3.firebasestorage.app",
            messagingSenderId: "841648877986",
            appId: "1:841648877986:web:9a70279ba4edafca8c2fb",
            measurementId: "G-EVPMSD8YBW"
        };

        try {
            firebase.initializeApp(firebaseConfig);
        } catch(e) {}
        const db = firebase.firestore();

        // ============================================================
        // CHRONOMÈTRE
        // ============================================================
        let timerSeconds = 90;
        let timerRemaining = 90;
        let timerInterval = null;
        let timerRunning = false;

        function setTimerPreset(seconds) {
            timerSeconds = seconds;
            timerRemaining = seconds;
            document.querySelectorAll('.timer-presets button').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.seconds) === seconds);
            });
            updateTimerDisplay();
            if (timerRunning) {
                clearInterval(timerInterval);
                timerRunning = false;
            }
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timerRemaining / 60);
            const secs = timerRemaining % 60;
            const display = document.getElementById('timerDisplay');
            display.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            display.className = 'timer-display';
            if (timerRunning) {
                if (timerRemaining <= 5) display.classList.add('danger');
                else if (timerRemaining <= 15) display.classList.add('warning');
            }
        }

        function startTimer() {
            if (timerRunning) return;
            if (timerRemaining <= 0) timerRemaining = timerSeconds;
            timerRunning = true;
            timerInterval = setInterval(() => {
                timerRemaining--;
                updateTimerDisplay();
                if (timerRemaining <= 0) {
                    clearInterval(timerInterval);
                    timerRunning = false;
                    document.getElementById('timerDisplay').className = 'timer-display danger';
                    try {
                        const ctx = new(window.AudioContext || window.webkitAudioContext)();
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.frequency.value = 880;
                        osc.type = 'sine';
                        gain.gain.value = 0.3;
                        osc.start();
                        setTimeout(() => { osc.stop(); ctx.close(); }, 300);
                    } catch(e) {}
                    showToast('⏰ Temps de repos écoulé !', 'error');
                }
            }, 1000);
            updateTimerDisplay();
        }

        function pauseTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
                timerRunning = false;
                updateTimerDisplay();
            }
        }

        function resetTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            timerRunning = false;
            timerRemaining = timerSeconds;
            updateTimerDisplay();
        }

        // ============================================================
        // DONNÉES
        // ============================================================
        const DAY_NAMES = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
        const DAY_SUB = ['Poitrine & Triceps', 'Dos & Biceps', 'Jambes', 'Épaules & Cœur', 'Poitrine & Triceps', 'Dos & Biceps',
            'Jambes'
        ];

        // ============================================================
        // DONNÉES PAR DÉFAUT (avec les nouveaux groupes musculaires)
        // ============================================================
        const DEFAULT_DATA = {
            day0: [{ n: 'Développé couché', m: 'Pectoraux', s: 4, r: '6-8', e: '🏋️', 
                    gif: 'https://www.docteur-fitness.com/wp-content/uploads/2019/08/developpe-couche.gif',
                    desc: 'Allongez-vous sur un banc plat, les pieds bien ancrés au sol. Saisissez la barre avec une prise légèrement plus large que les épaules. Abaissez la barre lentement (2-3 secondes) jusqu\'à toucher la poitrine. Poussez vers le haut en contractant fortement les pectoraux.',
                    tips: 'Gardez les omoplates plaquées contre le banc. Contrôlez la descente. Expirez en poussant, inspirez en descendant.' },
                   { n: 'Développé incliné haltères', m: 'Pectoraux', s: 3, r: '8-10', e: '💪',
                    gif: 'https://www.docteur-fitness.com/wp-content/uploads/2019/08/developpe-incline-halteres.gif',
                    desc: 'Banc incliné à 30-45°. Un haltère dans chaque main. Poussez vers le haut en rapprochant les haltères.',
                    tips: 'Maintiens les poignets droits. Ne va pas trop bas pour protéger les épaules.' },
                   { n: 'Écartés aux câbles', m: 'Pectoraux', s: 3, r: '12-15', e: '🎯',
                    gif: 'https://www.docteur-fitness.com/wp-content/uploads/2019/08/ecartes-cables.gif',
                    desc: 'Debout entre deux poulies hautes. Saisissez les poignées. Ramenez les mains devant vous en croisant les poignets.',

        // ============================================================
        // ÉTAT
        // ============================================================
        let currentDay = 0;
        let data = {};
        let done = {};
        let logs = {};

        // ============================================================
        // VOYANT
        // ============================================================
        function setSaveStatus(status, message) {
            const dot = document.getElementById('saveDot');
            const text = document.getElementById('saveText');
            dot.className = 'save-dot';
            text.className = 'save-text';
            if (status === 'saving') { dot.classList.add('saving'); text.textContent = message || 'Sauvegarde...'; }
            else if (status === 'saved') { dot.classList.add('saved'); text.textContent = message || 'Sauvegardé ✓'; text.classList.add('saved'); }
            else if (status === 'error') { dot.classList.add('error'); text.textContent = message || 'Erreur ⚠️'; text.classList.add('error'); }
            else { text.textContent = message || 'Prêt'; }
        }

        // ============================================================
        // FIREBASE
        // ============================================================
        async function loadFromFirebase() {
            setSaveStatus('saving', 'Chargement...');
            try {
                const docRef = db.collection('users').doc('user1');
                const doc = await docRef.get();
                if (doc.exists) {
                    const firebaseData = doc.data();
                    data = firebaseData.data || JSON.parse(JSON.stringify(DEFAULT_DATA));
                    done = firebaseData.done || {};
                    logs = firebaseData.logs || {};
                    setSaveStatus('saved', 'Données chargées ✓');
                    return true;
                } else {
                    data = JSON.parse(JSON.stringify(DEFAULT_DATA));
                    done = {};
                    logs = {};
                    await saveToFirebase();
                    setSaveStatus('saved', 'Données créées ✓');
                    return true;
                }
            } catch (e) {
                console.error('Erreur chargement:', e);
                setSaveStatus('error', 'Erreur chargement');
                return false;
            }
        }

        async function saveToFirebase() {
            setSaveStatus('saving', 'Sauvegarde...');
            try {
                await db.collection('users').doc('user1').set({
                    data: data,
                    done: done,
                    logs: logs,
                    lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                });
                setSaveStatus('saved', 'Sauvegardé ✓');
                return true;
            } catch (e) {
                console.error('Erreur sauvegarde:', e);
                setSaveStatus('error', 'Erreur sauvegarde');
                return false;
            }
        }

        // ============================================================
        // INIT
        // ============================================================
        async function init() {
            document.querySelector('.timer-presets button.active')?.classList.remove('active');
            document.querySelector('.timer-presets button[data-seconds="90"]')?.classList.add('active');
            updateTimerDisplay();

            const loaded = await loadFromFirebase();
            if (!loaded) {
                data = JSON.parse(JSON.stringify(DEFAULT_DATA));
                done = {};
                logs = {};
            }
            const today = new Date().getDay();
            currentDay = today === 0 ? 6 : today - 1;
            render();
        }

        async function autoSave() {
            await saveToFirebase();
        }

        // ============================================================
        // DÉPLACER UN EXERCICE
        // ============================================================
        async function moveExercise(dayKey, index, direction) {
            const dayData = data[dayKey];
            if (!dayData || dayData.length <= 1) return;
            
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= dayData.length) return;
            
            const temp = dayData[index];
            dayData[index] = dayData[newIndex];
            dayData[newIndex] = temp;
            
            const logKey1 = `${dayKey}_${index}`;
            const logKey2 = `${dayKey}_${newIndex}`;
            if (logs[logKey1] || logs[logKey2]) {
                const tempLog = logs[logKey1] || { w: '', r: '' };
                logs[logKey1] = logs[logKey2] || { w: '', r: '' };
                logs[logKey2] = tempLog;
            }
            
            if (done[dayKey]) {
                const tempDone = done[dayKey][index] || false;
                done[dayKey][index] = done[dayKey][newIndex] || false;
                done[dayKey][newIndex] = tempDone;
            }
            
            render();
            await autoSave();
            showToast(`Exercice déplacé ${direction < 0 ? 'vers le haut' : 'vers le bas'}`, 'info');
        }

        // ============================================================
        // AFFICHAGE
        // ============================================================
        function render() {
            document.querySelectorAll('.day-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === currentDay);
                btn.onclick = () => { currentDay = i; render(); };
            });

            document.getElementById('weekdayIndicator').textContent = `📅 ${DAY_NAMES[currentDay]} — ${DAY_SUB[currentDay]}`;

            const dayKey = `day${currentDay}`;
            const dayData = data[dayKey] || [];
            const doneDay = done[dayKey] || [];
            const total = dayData.length;
            const doneCount = doneDay.filter(Boolean).length;
            document.getElementById('doneCount').textContent = doneCount;
            document.getElementById('totalCount').textContent = total;

            const container = document.getElementById('exercisesContainer');
            container.innerHTML = dayData.map((ex, i) => {
                const isDone = doneDay[i] || false;
                const log = logs[`${dayKey}_${i}`] || { w: '', r: '' };
                const isFirst = i === 0;
                const isLast = i === dayData.length - 1;
                
                return `
                    <div class="exercise-card">
                        <div class="top" onclick="showDetail('${dayKey}', ${i})">
                            <div class="emoji">${ex.e || '🏋️'}</div>
                            <div class="info">
                                <div class="name">${ex.n} <span class="muscle">${ex.m}</span></div>
                                <div class="sets-reps">
                                    <span class="label">📊</span>
                                    <button class="adj" onclick="event.stopPropagation();adjustSet('${dayKey}',${i},-1)">−</button>
                                    <span class="val">${ex.s}</span>
                                    <button class="adj" onclick="event.stopPropagation();adjustSet('${dayKey}',${i},1)">+</button>
                                    <span style="margin:0 4px;">|</span>
                                    <button class="adj" onclick="event.stopPropagation();adjustRep('${dayKey}',${i},-1)">−</button>
                                    <span class="val">${ex.r}</span>
                                    <button class="adj" onclick="event.stopPropagation();adjustRep('${dayKey}',${i},1)">+</button>
                                </div>
                            </div>
                            <div class="log">
                                Poids <input type="number" id="w_${dayKey}_${i}" value="${log.w}" min="0" step="0.5" onclick="event.stopPropagation();" onchange="saveLog('${dayKey}',${i},'w',this.value)">
                                Reps <input type="number" id="r_${dayKey}_${i}" value="${log.r}" min="0" onclick="event.stopPropagation();" onchange="saveLog('${dayKey}',${i},'r',this.value)">
                            </div>
                            <button class="check ${isDone?'done':''}" onclick="event.stopPropagation();toggleDone('${dayKey}',${i})">${isDone?'✓':''}</button>
                        </div>
                        <div class="actions">
                            <button class="move-btn up" onclick="event.stopPropagation();moveExercise('${dayKey}',${i},-1)" ${isFirst ? 'disabled' : ''}>⬆️</button>
                            <button class="move-btn down" onclick="event.stopPropagation();moveExercise('${dayKey}',${i},1)" ${isLast ? 'disabled' : ''}>⬇️</button>
                            <button class="edit" onclick="openEdit('${dayKey}',${i})">✏️ Modifier</button>
                            <button class="del" onclick="deleteEx('${dayKey}',${i})">🗑️ Supprimer</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ============================================================
        // ACTIONS
        // ============================================================
        async function toggleDone(dayKey, i) {
            if (!done[dayKey]) done[dayKey] = [];
            done[dayKey][i] = !done[dayKey][i];
            render();
            await autoSave();
        }

        async function saveLog(dayKey, i, field, val) {
            const k = `${dayKey}_${i}`;
            if (!logs[k]) logs[k] = { w: '', r: '' };
            logs[k][field] = val;
            await autoSave();
        }

        async function adjustSet(dayKey, i, delta) {
            const ex = data[dayKey][i];
            if (!ex) return;
            ex.s = Math.max(1, (ex.s || 3) + delta);
            render();
            await autoSave();
        }

        async function adjustRep(dayKey, i, delta) {
            const ex = data[dayKey][i];
            if (!ex) return;
            let val = ex.r || '8-10';
            if (!isNaN(val) && val.trim() !== '') {
                const n = Math.max(1, parseInt(val) + delta);
                ex.r = String(n);
            } else {
                const parts = val.split('-');
                if (parts.length === 2 && !isNaN(parts[0])) {
                    const base = parseInt(parts[0]);
                    const n = Math.max(1, base + delta);
                    ex.r = `${n}-${n+2}`;
                }
            }
            render();
            await autoSave();
        }

        async function deleteEx(dayKey, i) {
            if (!confirm('Supprimer ?')) return;
            data[dayKey].splice(i, 1);
            if (done[dayKey]) done[dayKey].splice(i, 1);
            render();
            await autoSave();
        }

        // ============================================================
        // AJOUTER / MODIFIER
        // ============================================================
        function openAdd() {
            const dayKey = `day${currentDay}`;
            document.getElementById('editTitle').textContent = '➕ Ajouter un exercice';
            document.getElementById('eName').value = '';
            document.getElementById('eMuscle').value = 'Pectoraux';
            document.getElementById('eSets').value = '3';
            document.getElementById('eReps').value = '';
            document.getElementById('eEmoji').value = '🏋️';
            document.getElementById('eDesc').value = '';
            document.getElementById('eTips').value = '';
            document.getElementById('eGif').value = '';
            document.getElementById('eDayKey').value = dayKey;
            document.getElementById('eIndex').value = -1;
            document.getElementById('editModal').classList.add('active');
        }

        let editDayKey = 'day0',
            editIndex = 0;

        function openEdit(dayKey, i) {
            editDayKey = dayKey;
            editIndex = i;
            const ex = data[dayKey][i];
            if (!ex) return;
            document.getElementById('editTitle').textContent = '✏️ Modifier ' + ex.n;
            document.getElementById('eName').value = ex.n;
            document.getElementById('eMuscle').value = ex.m;
            document.getElementById('eSets').value = ex.s;
            document.getElementById('eReps').value = ex.r;
            document.getElementById('eEmoji').value = ex.e || '🏋️';
            document.getElementById('eDesc').value = ex.desc || '';
            document.getElementById('eTips').value = ex.tips || '';
            document.getElementById('eGif').value = ex.gif || '';
            document.getElementById('eDayKey').value = dayKey;
            document.getElementById('eIndex').value = i;
            document.getElementById('editModal').classList.add('active');
        }

        function closeEdit() {
            document.getElementById('editModal').classList.remove('active');
        }

        async function saveEdit(e) {
            e.preventDefault();
            const dayKey = document.getElementById('eDayKey').value;
            const i = parseInt(document.getElementById('eIndex').value);
            const name = document.getElementById('eName').value.trim();
            if (!name) { alert('Entrez un nom'); return; }

            const newEx = {
                n: name,
                m: document.getElementById('eMuscle').value,
                s: parseInt(document.getElementById('eSets').value) || 3,
                r: document.getElementById('eReps').value.trim(),
                e: document.getElementById('eEmoji').value.trim() || '🏋️',
                desc: document.getElementById('eDesc').value.trim(),
                tips: document.getElementById('eTips').value.trim(),
                gif: document.getElementById('eGif').value.trim() || ''
            };

            if (!data[dayKey]) data[dayKey] = [];

            if (i === -1) {
                data[dayKey].push(newEx);
                if (!done[dayKey]) done[dayKey] = [];
                done[dayKey].push(false);
            } else {
                const ex = data[dayKey][i];
                if (ex) {
                    ex.n = newEx.n;
                    ex.m = newEx.m;
                    ex.s = newEx.s;
                    ex.r = newEx.r;
                    ex.e = newEx.e;
                    ex.desc = newEx.desc;
                    ex.tips = newEx.tips;
                    ex.gif = newEx.gif;
                }
            }
            render();
            closeEdit();
            await autoSave();
        }

        // ============================================================
        // DETAIL
        // ============================================================
        let detailDayKey = 'day0',
            detailIndex = 0;

        function showDetail(dayKey, i) {
            detailDayKey = dayKey;
            detailIndex = i;
            const ex = data[dayKey][i];
            if (!ex) return;
            document.getElementById('detailTitle').textContent = '🏋️ ' + ex.n;

            const img = document.getElementById('detailImage');
            if (ex.gif && ex.gif.trim() !== '') {
                img.innerHTML = `<img src="${ex.gif}" alt="${ex.n}" onerror="this.parentElement.innerHTML='<div class=\\'no-img\\'>🏋️</div>'">`;
            } else {
                img.innerHTML = `<div class="no-img">🏋️</div>`;
            }
            document.getElementById('gifInput').value = ex.gif || '';

            document.getElementById('detailStats').innerHTML = `
                <div class="stat"><div class="value">${ex.s}</div><div class="label">Séries</div></div>
                <div class="stat"><div class="value" style="color:#b388ff;">${ex.r}</div><div class="label">Répétitions</div></div>
                <div class="stat"><div class="value" style="color:#00e676;">${ex.m}</div><div class="label">Groupe</div></div>
            `;

            document.getElementById('detailBody').innerHTML = `
                <div class="detail-section"><h4>📝 Description</h4><p>${ex.desc || 'Aucune description.'}</p></div>
                <div class="detail-section"><h4>⚠️ Conseils de sécurité</h4><div class="tips"><p>${ex.tips || 'Aucun conseil.'}</p></div></div>
            `;

            document.getElementById('detailModal').classList.add('active');
        }

        function closeDetail() {
            document.getElementById('detailModal').classList.remove('active');
        }

        async function updateGif() {
            const url = document.getElementById('gifInput').value.trim();
            if (!url) return;
            const ex = data[detailDayKey][detailIndex];
            if (ex) {
                ex.gif = url;
                document.getElementById('detailImage').innerHTML =
                    `<img src="${url}" alt="${ex.n}" onerror="this.parentElement.innerHTML='<div class=\\'no-img\\'>🏋️</div>'">`;
                await autoSave();
            }
        }

        function showToast(msg, type) {
            const toast = document.createElement('div');
            toast.style.cssText =
                `position:fixed;bottom:20px;right:20px;background:#111827;border:1px solid #2a3a4f;border-radius:12px;padding:12px 20px;color:#f0f4f8;font-size:0.9rem;z-index:2000;animation:fadeIn 0.3s ease;box-shadow:0 8px 32px rgba(0,0,0,0.5);${type==='error'?'border-left:3px solid #ff5252;':''}`;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300); }, 3000);
        }

        // ============================================================
        // EVENTS
        // ============================================================
        document.querySelectorAll('.modal-overlay').forEach(el => {
            el.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('active');
                }
            });
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal-overlay.active').forEach(el => el.classList.remove('active'));
            }
        });

        document.addEventListener('DOMContentLoaded', init);

        window.showDetail = showDetail;
        window.closeDetail = closeDetail;
        window.updateGif = updateGif;
        window.openAdd = openAdd;
        window.openEdit = openEdit;
        window.closeEdit = closeEdit;
        window.saveEdit = saveEdit;
        window.toggleDone = toggleDone;
        window.saveLog = saveLog;
        window.adjustSet = adjustSet;
        window.adjustRep = adjustRep;
        window.deleteEx = deleteEx;
        window.moveExercise = moveExercise;
        window.startTimer = startTimer;
        window.pauseTimer = pauseTimer;
        window.resetTimer = resetTimer;
        window.setTimerPreset = setTimerPreset;
    </script>
</body>
</html>
