<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏋️ Mon Programme</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',system-ui,sans-serif;background:#0a0e17;color:#f0f4f8;padding:16px;max-width:850px;margin:0 auto}
        .header{display:flex;justify-content:space-between;align-items:center;padding:20px 0 10px;border-bottom:2px solid #2a3a4f;margin-bottom:16px;flex-wrap:wrap;gap:10px}
        .header h1{font-size:1.8rem;background:linear-gradient(135deg,#00d4ff,#b388ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .header-right{display:flex;align-items:center;gap:12px}
        .save-indicator{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:20px;border:1px solid #2a3a4f;background:#111827;font-size:0.75rem}
        .save-dot{width:12px;height:12px;border-radius:50%;display:inline-block;transition:all 0.5s ease}
        .save-dot.saving{background:#ffab00;box-shadow:0 0 12px rgba(255,171,0,0.4);animation:pulse 0.8s ease-in-out infinite}
        .save-dot.saved{background:#00e676;box-shadow:0 0 12px rgba(0,230,118,0.3)}
        .save-dot.error{background:#ff5252;box-shadow:0 0 12px rgba(255,82,82,0.3)}
        @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
        .save-text{color:#8ba0b8;font-weight:600}
        .save-text.saved{color:#00e676}
        .save-text.error{color:#ff5252}
        .btn-add{background:#00d4ff;color:#0a0e17;border:none;padding:8px 18px;border-radius:10px;font-weight:700;cursor:pointer;font-size:0.85rem;font-family:inherit;transition:background 0.3s}
        .btn-add:hover{background:#00b8d4}
        .day-selector{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px}
        .day-btn{padding:10px 2px;border:2px solid #2a3a4f;border-radius:10px;background:#111827;color:#8ba0b8;cursor:pointer;font-weight:700;font-size:0.65rem;text-align:center;transition:all 0.3s ease;font-family:inherit}
        .day-btn:hover{border-color:#00d4ff;color:#f0f4f8}
        .day-btn.active{border-color:#00d4ff;background:#00d4ff;color:#0a0e17}
        .day-btn .sub{display:block;font-weight:400;font-size:0.5rem;opacity:0.7;margin-top:2px}
        .weekday-indicator{text-align:center;padding:8px 16px;background:#00d4ff;color:#0a0e17;border-radius:12px;font-weight:700;font-size:1rem;margin-bottom:16px}
        .progress{text-align:center;color:#8ba0b8;margin-bottom:16px;font-size:0.9rem}
        .progress strong{color:#00d4ff}
        .exercise-card{background:#111827;border:1px solid #2a3a4f;border-radius:14px;padding:14px 16px;margin-bottom:10px}
        .exercise-card .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
        .exercise-card .emoji{font-size:1.8rem;width:40px;height:40px;border-radius:10px;background:#0a0e17;border:1px solid #2a3a4f;display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .exercise-card .info{flex:1;min-width:100px}
        .exercise-card .info .name{font-weight:700;font-size:0.95rem}
        .exercise-card .info .muscle{font-size:0.55rem;font-weight:400;color:#8ba0b8;background:#0a0e17;padding:2px 10px;border-radius:20px;margin-left:6px}
        .exercise-card .info .sets-reps{display:flex;align-items:center;gap:4px;margin-top:4px;flex-wrap:wrap;font-size:0.7rem;color:#8ba0b8}
        .exercise-card .info .sets-reps .val{color:#00d4ff;font-weight:700;min-width:20px;text-align:center}
        .exercise-card .info .sets-reps .adj{width:20px;height:20px;border-radius:50%;border:1px solid #2a3a4f;background:transparent;color:#8ba0b8;cursor:pointer;font-size:0.6rem;display:flex;align-items:center;justify-content:center;font-family:inherit}
        .exercise-card .info .sets-reps .adj:hover{border-color:#00d4ff;color:#00d4ff}
        .exercise-card .log{display:flex;align-items:center;gap:6px;font-size:0.7rem;color:#8ba0b8;flex-wrap:wrap}
        .exercise-card .log input{width:40px;padding:2px 4px;border-radius:6px;border:1px solid #2a3a4f;background:#0a0e17;color:#f0f4f8;font-size:0.7rem;text-align:center}
        .exercise-card .check{width:28px;height:28px;border-radius:50%;border:2px solid #2a3a4f;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.9rem;color:transparent;transition:all 0.3s ease;flex-shrink:0}
        .exercise-card .check.done{background:#00e676;border-color:#00e676;color:#0a0e17}
        .exercise-card .actions{display:flex;gap:6px;border-top:1px solid #2a3a4f;padding-top:8px;margin-top:8px;flex-wrap:wrap}
        .exercise-card .actions button{background:transparent;border:1px solid #2a3a4f;border-radius:6px;color:#8ba0b8;cursor:pointer;padding:4px 12px;font-size:0.7rem;font-family:inherit;transition:all 0.3s ease}
        .exercise-card .actions button:hover{background:#2a3a4f;color:#f0f4f8}
        .exercise-card .actions .edit:hover{border-color:#00d4ff;color:#00d4ff}
        .exercise-card .actions .del:hover{border-color:#f85149;color:#f85149;background:rgba(248,81,73,0.1)}
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px}
        .modal-overlay.active{display:flex}
        .modal{background:#111827;border:1px solid #2a3a4f;border-radius:16px;max-width:550px;width:100%;max-height:90vh;overflow-y:auto;padding:24px;animation:fadeIn 0.3s ease}
        @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        .modal .close{float:right;background:none;border:none;color:#8ba0b8;font-size:1.5rem;cursor:pointer;padding:0 4px}
        .modal .close:hover{color:#f0f4f8}
        .modal h2{font-size:1.2rem;margin-bottom:12px}
        .modal .form-group{margin-bottom:14px}
        .modal .form-group label{display:block;font-size:0.7rem;font-weight:600;color:#8ba0b8;margin-bottom:3px;text-transform:uppercase;letter-spacing:0.5px}
        .modal .form-group input,.modal .form-group select,.modal .form-group textarea{width:100%;padding:8px 12px;border-radius:8px;border:1px solid #2a3a4f;background:#0a0e17;color:#f0f4f8;font-size:0.9rem;font-family:inherit}
        .modal .form-group input:focus,.modal .form-group select:focus,.modal .form-group textarea:focus{outline:none;border-color:#00d4ff}
        .modal .form-group textarea{resize:vertical;min-height:50px}
        .modal .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        .modal .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
        .btn-ghost{background:transparent;color:#8ba0b8;border:1px solid #2a3a4f;padding:8px 16px;border-radius:8px;font-weight:600;cursor:pointer;font-family:inherit}
        .btn-ghost:hover{background:#1a2332;color:#f0f4f8}
        .btn-primary{background:#00d4ff;color:#0a0e17;border:none;padding:8px 16px;border-radius:8px;font-weight:700;cursor:pointer;font-family:inherit}
        .btn-primary:hover{background:#00b8d4}
        .modal .detail-section{background:#0a0e17;padding:12px 14px;border-radius:10px;border:1px solid #2a3a4f;margin-bottom:10px}
        .modal .detail-section h4{font-size:0.6rem;text-transform:uppercase;color:#8ba0b8;margin-bottom:4px;letter-spacing:0.5px}
        .modal .detail-section p{font-size:0.85rem;line-height:1.7;white-space:pre-line}
        .modal .detail-section .tips{border-left:3px solid #ffab00;padding-left:12px}
        .modal .detail-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
        .modal .detail-stats .stat{text-align:center;background:#0a0e17;padding:8px;border-radius:10px;border:1px solid #2a3a4f}
        .modal .detail-stats .stat .value{font-size:1.3rem;font-weight:800;color:#00d4ff}
        .modal .detail-stats .stat .label{font-size:0.5rem;text-transform:uppercase;color:#8ba0b8;letter-spacing:0.5px;margin-top:2px}
        .modal .image-container{width:100%;background:#0a0e17;border:1px solid #2a3a4f;border-radius:12px;margin-bottom:12px;min-height:150px;display:flex;align-items:center;justify-content:center}
        .modal .image-container img{width:100%;max-height:200px;object-fit:contain;border-radius:12px}
        .modal .image-container .no-img{font-size:2rem;opacity:0.3}
        .modal .gif-input{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
        .modal .gif-input input{flex:1;padding:6px 10px;border-radius:8px;border:1px solid #2a3a4f;background:#0a0e17;color:#f0f4f8;font-size:0.8rem;font-family:inherit;min-width:120px}
        .modal .gif-input button{padding:6px 14px;border-radius:8px;border:none;background:#00d4ff;color:#0a0e17;font-weight:700;cursor:pointer;font-size:0.75rem;font-family:inherit}
        .modal .gif-input button:hover{background:#00b8d4}
        @media (max-width:600px){.day-selector{grid-template-columns:repeat(7,1fr);gap:3px}.day-btn{font-size:0.5rem;padding:6px 2px}}
        @media (max-width:480px){.day-selector{grid-template-columns:repeat(4,1fr);gap:4px}.day-btn{font-size:0.6rem;padding:8px 4px}.exercise-card{padding:12px}.exercise-card .top{gap:8px}.exercise-card .info .name{font-size:0.85rem}.modal{padding:16px}.modal .form-row{grid-template-columns:1fr}.modal .detail-stats{grid-template-columns:1fr 1fr}}
    </style>
</head>
<body>

    <div class="header">
        <h1>🏋️ Mon Programme</h1>
        <div class="header-right">
            <div class="save-indicator" id="saveIndicator">
                <span class="save-dot" id="saveDot"></span>
                <span class="save-text" id="saveText">Connexion...</span>
            </div>
            <button class="btn-add" onclick="openAdd()">➕ Ajouter</button>
        </div>
    </div>

    <div class="day-selector" id="daySelector">
        <button class="day-btn" data-day="0">Lun<br><span class="sub">Poitrine</span></button>
        <button class="day-btn" data-day="1">Mar<br><span class="sub">Dos</span></button>
        <button class="day-btn" data-day="2">Mer<br><span class="sub">Jambes</span></button>
        <button class="day-btn" data-day="3">Jeu<br><span class="sub">Épaules</span></button>
        <button class="day-btn" data-day="4">Ven<br><span class="sub">Poitrine</span></button>
        <button class="day-btn" data-day="5">Sam<br><span class="sub">Dos</span></button>
        <button class="day-btn" data-day="6">Dim<br><span class="sub">Jambes</span></button>
    </div>

    <div class="weekday-indicator" id="weekdayIndicator">📅 Lundi — Poitrine & Triceps</div>

    <div class="progress">✅ <strong id="doneCount">0</strong> / <span id="totalCount">0</span></div>

    <div id="exercisesContainer"></div>

    <!-- MODALS -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal">
            <button class="close" onclick="closeDetail()">✕</button>
            <h2 id="detailTitle">🏋️ Exercice</h2>
            <div class="image-container" id="detailImage"><div class="no-img">🏋️</div></div>
            <div class="gif-input">
                <input type="text" id="gifInput" placeholder="URL du GIF">
                <button onclick="updateGif()">Mettre à jour</button>
            </div>
            <div class="detail-stats" id="detailStats"></div>
            <div id="detailBody"></div>
        </div>
    </div>

    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <button class="close" onclick="closeEdit()">✕</button>
            <h2 id="editTitle">✏️ Modifier</h2>
            <form id="editForm" onsubmit="saveEdit(event)">
                <div class="form-group"><label>Nom</label><input type="text" id="eName" required></div>
                <div class="form-group">
                    <label>Groupe</label>
                    <select id="eMuscle">
                        <option value="Poitrine">Poitrine</option>
                        <option value="Triceps">Triceps</option>
                        <option value="Dos">Dos</option>
                        <option value="Biceps">Biceps</option>
                        <option value="Jambes">Jambes</option>
                        <option value="Épaules">Épaules</option>
                        <option value="Cœur">Cœur</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Séries</label><input type="number" id="eSets" min="1"></div>
                    <div class="form-group"><label>Répétitions</label><input type="text" id="eReps"></div>
                </div>
                <div class="form-group"><label>Emoji</label><input type="text" id="eEmoji" placeholder="Ex: 🏋️ 💪 🔥" maxlength="4"></div>
                <div class="form-group"><label>Description</label><textarea id="eDesc" rows="3"></textarea></div>
                <div class="form-group"><label>Conseils</label><textarea id="eTips" rows="3"></textarea></div>
                <div class="form-group"><label>GIF (URL)</label><input type="text" id="eGif" placeholder="https://..."></div>
                <input type="hidden" id="eDay">
                <input type="hidden" id="eIndex">
                <div class="modal-actions">
                    <button type="button" class="btn-ghost" onclick="closeEdit()">Annuler</button>
                    <button type="submit" class="btn-primary">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ============================================================
        // CONFIGURATION FIREBASE
        // ============================================================
        // 🔴 REMPLACEZ CES VALEURS PAR LES VÔTRES ! 🔴
        const firebaseConfig = {
            apiKey: "VOTRE_API_KEY",
            authDomain: "VOTRE_PROJET.firebaseapp.com",
            projectId: "VOTRE_PROJET",
            storageBucket: "VOTRE_PROJET.appspot.com",
            messagingSenderId: "VOTRE_SENDER_ID",
            appId: "VOTRE_APP_ID"
        };

        // Initialiser Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ============================================================
        // DONNÉES PAR DÉFAUT
        // ============================================================
        const DAY_NAMES = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
        const DAY_SUB = ['Poitrine & Triceps', 'Dos & Biceps', 'Jambes', 'Épaules & Cœur', 'Poitrine & Triceps', 'Dos & Biceps',
            'Jambes'
        ];

        const DEFAULT_DATA = [
            [{ n: 'Développé couché', m: 'Poitrine', s: 4, r: '6-8', e: '🏋️', 
              gif: 'https://www.docteur-fitness.com/wp-content/uploads/2019/08/developpe-couche.gif',
              desc: 'Allongez-vous sur un banc plat...', 
              tips: 'Gardez les omoplates plaquées.' }],
            [{ n: 'Soulevé de terre', m: 'Dos', s: 4, r: '5-6', e: '🏋️',
              gif: 'https://www.docteur-fitness.com/wp-content/uploads/2019/08/souleve-de-terre.gif',
              desc: 'Pieds largeur d\'épaules...',
              tips: 'DOS DROIT ABSOLUMENT !' }],
            [{ n: 'Squat', m: 'Jambes', s: 4, r: '6-8', e: '🦵',
              gif: 'https://www.docteur-fitness.com/wp-content/uploads/2019/08/squat.gif',
              desc: 'Barre sur les épaules...',
              tips: 'Dos droit, poitrine ouverte.' }],
            [{ n: 'Développé militaire', m: 'Épaules', s: 4, r: '6-8', e: '🏋️',
              gif: 'https://www.docteur-fitness.com/wp-content/uploads/2019/08/developpe-militaire.gif',
              desc: 'Debout ou assis...',
              tips: 'Gardez le buste stable.' }],
            [{ n: 'Développé couché', m: 'Poitrine', s: 4, r: '6-8', e: '🏋️',
              gif: 'https://www.docteur-fitness.com/wp-content/uploads/2019/08/developpe-couche.gif',
              desc: 'Allongez-vous sur un banc plat...',
              tips: 'Gardez les omoplates plaquées.' }],
            [{ n: 'Soulevé de terre', m: 'Dos', s: 4, r: '5-6', e: '🏋️',
              gif: 'https://www.docteur-fitness.com/wp-content/uploads/2019/08/souleve-de-terre.gif',
              desc: 'Pieds largeur d\'épaules...',
              tips: 'DOS DROIT ABSOLUMENT !' }],
            [{ n: 'Squat', m: 'Jambes', s: 4, r: '6-8', e: '🦵',
              gif: 'https://www.docteur-fitness.com/wp-content/uploads/2019/08/squat.gif',
              desc: 'Barre sur les épaules...',
              tips: 'Dos droit, poitrine ouverte.' }]
        ];

        // ============================================================
        // ÉTAT
        // ============================================================
        let currentDay = 0;
        let data = [];
        let done = [];
        let logs = {};
        let isFirebaseReady = false;
        let userId = 'user1';

        // ============================================================
        // VOYANT
        // ============================================================
        function setSaveStatus(status, message) {
            const dot = document.getElementById('saveDot');
            const text = document.getElementById('saveText');
            dot.className = 'save-dot';
            text.className = 'save-text';
            if (status === 'saving') { dot.classList.add('saving'); text.textContent = message || 'Sauvegarde...'; }
            else if (status === 'saved') { dot.classList.add('saved'); text.textContent = message || 'Sauvegardé ✓'; text.classList.add('saved'); }
            else if (status === 'error') { dot.classList.add('error'); text.textContent = message || 'Erreur ⚠️'; text.classList.add('error'); }
            else { text.textContent = message || 'Prêt'; }
        }

        // ============================================================
        // CHARGER LES DONNÉES DEPUIS FIREBASE
        // ============================================================
        async function loadFromFirebase() {
            setSaveStatus('saving', 'Chargement...');
            try {
                const docRef = db.collection('users').doc(userId);
                const doc = await docRef.get();
                
                if (doc.exists) {
                    const firebaseData = doc.data();
                    if (firebaseData.data && firebaseData.data.length === 7) {
                        data = firebaseData.data;
                    } else {
                        data = JSON.parse(JSON.stringify(DEFAULT_DATA));
                    }
                    done = firebaseData.done || data.map(day => day.map(() => false));
                    logs = firebaseData.logs || {};
                    setSaveStatus('saved', 'Données chargées ✓');
                    return true;
                } else {
                    // Premier lancement : créer les données par défaut
                    data = JSON.parse(JSON.stringify(DEFAULT_DATA));
                    done = data.map(day => day.map(() => false));
                    logs = {};
                    await saveToFirebase();
                    setSaveStatus('saved', 'Données créées ✓');
                    return true;
                }
            } catch (e) {
                console.warn('Erreur Firebase:', e);
                setSaveStatus('error', 'Erreur chargement');
                return false;
            }
        }

        // ============================================================
        // SAUVEGARDER DANS FIREBASE
        // ============================================================
        async function saveToFirebase() {
            setSaveStatus('saving', 'Sauvegarde...');
            try {
                await db.collection('users').doc(userId).set({
                    data: data,
                    done: done,
                    logs: logs,
                    lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                });
                setSaveStatus('saved', 'Sauvegardé ✓');
                return true;
            } catch (e) {
                console.warn('Erreur sauvegarde:', e);
                setSaveStatus('error', 'Erreur sauvegarde');
                return false;
            }
        }

        // ============================================================
        // INIT
        // ============================================================
        async function init() {
            // Charger les données depuis Firebase
            const loaded = await loadFromFirebase();
            
            if (!loaded) {
                // Fallback sur les données par défaut
                data = JSON.parse(JSON.stringify(DEFAULT_DATA));
                done = data.map(day => day.map(() => false));
                logs = {};
            }
            
            // Jour actuel
            const today = new Date().getDay();
            currentDay = today === 0 ? 6 : today - 1;
            
            render();
        }

        // ============================================================
        // SAUVEGARDE AUTOMATIQUE
        // ============================================================
        async function autoSave() {
            await saveToFirebase();
        }

        // ============================================================
        // AFFICHAGE
        // ============================================================
        function render() {
            document.querySelectorAll('.day-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === currentDay);
                btn.onclick = () => { currentDay = i; render(); };
            });

            document.getElementById('weekdayIndicator').textContent = `📅 ${DAY_NAMES[currentDay]} — ${DAY_SUB[currentDay]}`;

            const dayData = data[currentDay] || [];
            const doneDay = done[currentDay] || [];
            const total = dayData.length;
            const doneCount = doneDay.filter(Boolean).length;
            document.getElementById('doneCount').textContent = doneCount;
            document.getElementById('totalCount').textContent = total;

            const container = document.getElementById('exercisesContainer');
            container.innerHTML = dayData.map((ex, i) => {
                const isDone = doneDay[i] || false;
                const log = logs[`${currentDay}_${i}`] || { w: '', r: '' };
                return `
                    <div class="exercise-card">
                        <div class="top" onclick="showDetail(${currentDay}, ${i})">
                            <div class="emoji">${ex.e || '🏋️'}</div>
                            <div class="info">
                                <div class="name">${ex.n} <span class="muscle">${ex.m}</span></div>
                                <div class="sets-reps">
                                    <span class="label">📊</span>
                                    <button class="adj" onclick="event.stopPropagation();adjustSet(${currentDay},${i},-1)">−</button>
                                    <span class="val">${ex.s}</span>
                                    <button class="adj" onclick="event.stopPropagation();adjustSet(${currentDay},${i},1)">+</button>
                                    <span style="margin:0 4px;">|</span>
                                    <button class="adj" onclick="event.stopPropagation();adjustRep(${currentDay},${i},-1)">−</button>
                                    <span class="val">${ex.r}</span>
                                    <button class="adj" onclick="event.stopPropagation();adjustRep(${currentDay},${i},1)">+</button>
                                </div>
                            </div>
                            <div class="log">
                                Poids <input type="number" id="w_${currentDay}_${i}" value="${log.w}" min="0" step="0.5" onclick="event.stopPropagation();" onchange="saveLog(${currentDay},${i},'w',this.value)">
                                Reps <input type="number" id="r_${currentDay}_${i}" value="${log.r}" min="0" onclick="event.stopPropagation();" onchange="saveLog(${currentDay},${i},'r',this.value)">
                            </div>
                            <button class="check ${isDone?'done':''}" onclick="event.stopPropagation();toggleDone(${currentDay},${i})">${isDone?'✓':''}</button>
                        </div>
                        <div class="actions">
                            <button class="edit" onclick="openEdit(${currentDay},${i})">✏️ Modifier</button>
                            <button class="del" onclick="deleteEx(${currentDay},${i})">🗑️ Supprimer</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ============================================================
        // ACTIONS (avec sauvegarde Firebase)
        // ============================================================
        async function toggleDone(day, i) {
            if (!done[day]) done[day] = [];
            done[day][i] = !done[day][i];
            render();
            await autoSave();
        }

        async function saveLog(day, i, field, val) {
            const k = `${day}_${i}`;
            if (!logs[k]) logs[k] = { w: '', r: '' };
            logs[k][field] = val;
            await autoSave();
        }

        async function adjustSet(day, i, delta) {
            const ex = data[day][i];
            if (!ex) return;
            ex.s = Math.max(1, (ex.s || 3) + delta);
            render();
            await autoSave();
        }

        async function adjustRep(day, i, delta) {
            const ex = data[day][i];
            if (!ex) return;
            let val = ex.r || '8-10';
            if (!isNaN(val) && val.trim() !== '') {
                const n = Math.max(1, parseInt(val) + delta);
                ex.r = String(n);
            } else {
                const parts = val.split('-');
                if (parts.length === 2 && !isNaN(parts[0])) {
                    const base = parseInt(parts[0]);
                    const n = Math.max(1, base + delta);
                    ex.r = `${n}-${n+2}`;
                }
            }
            render();
            await autoSave();
        }

        async function deleteEx(day, i) {
            if (!confirm('Supprimer ?')) return;
            data[day].splice(i, 1);
            if (done[day]) done[day].splice(i, 1);
            render();
            await autoSave();
        }

            document.getElementById('eMuscle').value = 'Poitrine';
            document.getElementById('eSets').value = '3';
            document.getElementById('eReps').value = '';
            document.getElementById('eEmoji').value = '🏋
